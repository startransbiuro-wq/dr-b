<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obrót pustych pojemników</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --slate-950:#020617; --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155;
  --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1;
  --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
  --amber-700:#b45309; --amber-600:#d97706; --amber-500:#f59e0b; --amber-400:#fbbf24;
  --amber-100:#fef3c7; --amber-50:#fffbeb;
  --emerald-700:#047857; --emerald-600:#059669; --emerald-500:#10b981;
  --emerald-100:#d1fae5; --emerald-50:#ecfdf5;
  --red-600:#dc2626; --red-500:#ef4444; --red-100:#fee2e2; --red-50:#fef2f2;
  --sky-700:#0369a1; --sky-600:#0284c7; --sky-500:#0ea5e9; --sky-100:#e0f2fe; --sky-50:#f0f9ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--slate-50);
  color:var(--slate-800);
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important;}
h1,h2,h3,.display{font-family:'Archivo',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background-color:transparent;-webkit-appearance:none;appearance:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- Landing ---------- */
.landing{min-height:100vh;background:var(--slate-950);display:flex;align-items:center;justify-content:center;padding:24px;}
.landing-wrap{width:100%;max-width:760px;}
.landing-title{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--amber-400);margin-bottom:10px;}
.landing-title span{font-weight:800;font-size:20px;letter-spacing:.02em;}
.landing-sub{text-align:center;color:var(--slate-400);font-size:14px;margin-bottom:40px;}
.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:640px){.landing-grid{grid-template-columns:1fr;}}
.landing-card{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:16px;padding:32px;text-align:left;transition:border-color .15s;}
.landing-card:hover{border-color:rgba(245,158,11,.5);}
.landing-card.driver:hover{border-color:rgba(14,165,233,.5);}
.landing-card h2{color:#fff;font-size:18px;font-weight:700;margin:14px 0 6px;}
.landing-card p{color:var(--slate-400);font-size:14px;line-height:1.5;margin:0;}
.landing-card .cta{display:inline-block;margin-top:16px;font-size:14px;font-weight:700;color:var(--amber-400);}
.landing-card.driver .cta{color:var(--sky-500);}
.landing-foot{text-align:center;color:var(--slate-600);font-size:12px;margin-top:32px;}

/* ---------- Admin layout ---------- */
.admin{min-height:100vh;display:flex;}
.sidebar{width:250px;flex-shrink:0;background:var(--slate-800);display:flex;flex-direction:column;}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid var(--slate-700);display:flex;align-items:center;justify-content:center;}
.sidebar-logo img{width:100%;max-width:200px;height:auto;display:block;}
.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
.sidebar-userbar{padding:14px 16px;border-top:1px solid var(--slate-700);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sidebar-userbar .who{display:flex;flex-direction:column;min-width:0;}
.sidebar-userbar .who b{color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-userbar .who small{color:var(--slate-400);font-size:11px;}
.sidebar-userbar .btn-ghost{color:var(--slate-300);flex-shrink:0;padding:6px 10px;font-size:12px;}
.sidebar-userbar .btn-ghost:hover{background:var(--slate-700);color:#fff;}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--slate-50);padding:20px;}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:32px;}
.login-card .logohead{display:flex;justify-content:center;margin-bottom:22px;}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:none;border:none;color:var(--slate-300);font-size:14px;font-weight:500;text-align:left;}
.nav-item:hover{background:rgba(51,65,85,.6);color:#fff;}
.nav-item.active{background:var(--slate-700);color:#fff;}
.nav-item .dot{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;}
.nav-item .label{display:flex;align-items:center;gap:10px;}
.nav-badge{background:var(--amber-500);color:var(--slate-900);font-size:10px;font-weight:800;padding:1px 6px;border-radius:9999px;}
.sidebar-foot{padding:12px;border-top:1px solid var(--slate-800);}
.content{flex:1;min-width:0;}

/* ---------- Common widgets ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:32px 32px 22px;}
.topbar h1{font-size:24px;font-weight:800;color:var(--slate-900);margin:0;}
.topbar p{color:var(--slate-500);font-size:14px;margin:4px 0 0;}
.page{padding:0 32px 40px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;transition:background .15s;}
.btn-primary{background:var(--slate-900);color:#fff;}
.btn-primary:hover{background:var(--slate-800);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-full{width:100%;}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--slate-600);padding:7px 12px;border-radius:9px;font-size:14px;font-weight:600;}
.btn-ghost:hover{background:var(--slate-100);}
.btn-ghost.red{color:var(--red-600);}
.btn-ghost.red:hover{background:var(--red-50);}
.icon-btn{background:none;border:none;color:var(--slate-400);padding:6px;border-radius:8px;display:inline-flex;}
.icon-btn:hover{color:var(--slate-700);background:var(--slate-100);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:700;}
.badge-slate{background:var(--slate-100);color:var(--slate-600);}
.badge-amber{background:var(--amber-100);color:var(--amber-700);}
.badge-emerald{background:var(--emerald-100);color:var(--emerald-700);}
.badge-red{background:var(--red-100);color:var(--red-600);}
.badge-sky{background:var(--sky-100);color:var(--sky-700);}

.card{background:#fff;border:1px solid var(--slate-200);border-radius:14px;}
.card-pad{padding:20px;}
.dashed{border:1px dashed var(--slate-300);}
.empty{padding:60px 20px;text-align:center;color:var(--slate-400);}
.empty .icn{font-size:30px;opacity:.5;margin-bottom:10px;}
.empty .t{font-weight:600;color:var(--slate-500);}
.empty .s{font-size:13px;margin-top:4px;max-width:340px;margin-left:auto;margin-right:auto;}

table{width:100%;border-collapse:collapse;font-size:14px;}
thead{background:var(--slate-50);}
th{text-align:left;padding:12px 20px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate-500);font-weight:700;}
th.r,td.r{text-align:right;}
td{padding:12px 20px;border-top:1px solid var(--slate-100);color:var(--slate-700);}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--slate-50);}
.card.clickable{cursor:pointer;transition:border-color .15s;}
.card.clickable:hover{border-color:var(--slate-300);}

.field{display:block;margin-bottom:14px;}
.field .lab{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--slate-500);margin-bottom:5px;}
.input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--slate-300);font-size:14px;}
.input:focus{outline:2px solid var(--slate-800);outline-offset:0;border-color:transparent;}
.input.big{font-size:18px;}
textarea.input{resize:vertical;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.modal.wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--slate-100);position:sticky;top:0;background:#fff;}
.modal-head h3{margin:0;font-size:17px;font-weight:800;color:var(--slate-900);}
.modal-body{padding:20px;}
.modal-actions{display:flex;align-items:center;justify-content:space-between;margin-top:18px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
@media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:16px;}
.stat-card .n{font-size:24px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.stat-card .l{font-size:12px;color:var(--slate-500);margin-top:3px;}

.counter-row{display:flex;gap:12px;flex-wrap:wrap;}
.counter-box{background:var(--slate-900);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;min-width:96px;border:1px solid;}
.counter-box .v{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;}
.counter-box .l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-400);margin-top:4px;text-align:center;}
.tone-amber{border-color:rgba(245,158,11,.4);} .tone-amber .v{color:var(--amber-400);}
.tone-emerald{border-color:rgba(16,185,129,.4);} .tone-emerald .v{color:var(--emerald-500);}
.tone-sky{border-color:rgba(14,165,233,.4);} .tone-sky .v{color:var(--sky-500);}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:4px 9px;border-radius:6px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;}
.chip-sky{background:var(--sky-50);color:var(--sky-700);}
.chip-emerald{background:var(--emerald-50);color:var(--emerald-700);}
.chip-slate{background:var(--slate-100);color:var(--slate-600);}

/* route detail list rows */
.rowlist{background:#fff;border:1px solid var(--slate-200);border-radius:14px;}
.rowlist .item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--slate-100);}
.rowlist .item:first-child{border-top:none;}

/* przeciąganie kontrahentów na trasie myszką (drag & drop) */
.route-drag-item{cursor:grab;transition:background-color .1s;}
.route-drag-item:active{cursor:grabbing;}
.route-drag-item.dragging{opacity:.35;}
.route-drag-item.drag-over{background:var(--sky-50);box-shadow:inset 0 2px 0 var(--sky-500);}
.drag-handle{color:var(--slate-300);flex-shrink:0;display:inline-flex;}
.route-drag-item:hover .drag-handle{color:var(--slate-400);}
.rowlist .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate-400);width:20px;}
.rowlist .info{flex:1;min-width:0;}
.rowlist .info b{display:block;font-size:14px;font-weight:600;color:var(--slate-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rowlist .info small{color:var(--slate-500);font-size:12px;}
.rowlist .actions{display:flex;align-items:center;gap:2px;}

/* subtabs (moduł Pojemniki) */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--slate-200);margin-bottom:22px;}
.subtab{padding:10px 14px;background:none;border:none;border-bottom:2px solid transparent;font-size:14px;font-weight:600;color:var(--slate-500);margin-bottom:-1px;display:flex;align-items:center;gap:7px;}
.subtab:hover{color:var(--slate-800);}
.subtab.active{color:var(--slate-900);border-bottom-color:var(--slate-900);}

/* kafelki wyboru (np. rodzaj tankowania) */
.fuel-kind-tile{border:2px solid var(--slate-200);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;font-family:inherit;}
.fuel-kind-tile:hover{border-color:var(--slate-300);}
.fuel-kind-tile .t{font-weight:700;font-size:14px;color:var(--slate-700);}
.fuel-kind-tile .s{font-size:12px;color:var(--slate-500);}
.fuel-kind-tile.active{border-color:var(--slate-900);background:var(--slate-50);}
.fuel-kind-tile.active .t{color:var(--slate-900);}

/* małe kafelki wyboru jednostki (zamówienia) */
.unit-tile{border:1.5px solid var(--slate-200);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;background:#fff;color:var(--slate-500);cursor:pointer;font-family:inherit;line-height:1;}
.unit-tile:hover{border-color:var(--slate-300);}
.unit-tile.active{border-color:var(--slate-900);background:var(--slate-900);color:#fff;}

/* podpowiedzi wyszukiwania kontrahenta (autocomplete) */
.autocomplete-item{padding:9px 14px;font-size:14px;color:var(--slate-700);cursor:pointer;border-bottom:1px solid var(--slate-100);}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover, .autocomplete-item.hl{background:var(--slate-50);}
.autocomplete-empty{padding:12px 14px;font-size:13px;color:var(--slate-400);}

/* ---------- Driver mobile shell ---------- */
.driver-page{min-height:100vh;background:var(--slate-100);}
.driver-shell{max-width:440px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column;}
.driver-header{background:var(--slate-900);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.driver-header .t{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:14px;}
.driver-header .t .amber{color:var(--amber-400);}
.driver-header button{background:none;border:none;color:var(--slate-400);}
.driver-body{flex:1;padding:20px;padding-bottom:110px;}
.dcenter{display:flex;flex-direction:column;align-items:center;padding-top:60px;text-align:center;}
.dlogo{width:64px;height:64px;border-radius:18px;background:var(--slate-900);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.dcode-input{text-align:center;font-size:26px;letter-spacing:.4em;font-family:'JetBrains Mono',monospace;text-transform:uppercase;padding:14px;max-width:230px;}
.derr{color:var(--red-600);font-size:13px;margin-top:10px;}
.dlink-muted{display:block;width:100%;text-align:center;font-size:12px;color:var(--slate-400);margin-top:16px;background:none;border:none;}
.dlink-faint{display:flex;gap:5px;align-items:center;justify-content:center;width:100%;text-align:center;font-size:11px;color:var(--slate-300);margin-top:8px;background:none;border:none;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-400);margin:0 0 4px;}
.dhint{background:var(--slate-50);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--slate-500);margin-bottom:14px;}
.contractor-card{width:100%;text-align:left;background:#fff;border:1px solid var(--slate-200);border-radius:14px;padding:14px;margin-bottom:8px;}
.contractor-card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.contractor-card b{font-size:14px;color:var(--slate-800);}
.contractor-card small{color:var(--slate-500);font-size:12px;}
.contractor-card .visit-flag{color:var(--amber-600);font-size:12px;font-weight:700;flex-shrink:0;}
.driver-footer{position:fixed;bottom:0;left:0;right:0;}
.driver-footer-inner{max-width:440px;margin:0 auto;padding:14px;background:#fff;border-top:1px solid var(--slate-200);}
.status-line{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:8px;}
.status-line.ok{background:var(--emerald-50);color:var(--slate-700);}
.status-line.wait{background:var(--amber-50);color:var(--slate-700);}

@media print{
  body *{visibility:hidden;}
  .print-area, .print-area *{visibility:visible;}
  .print-area{position:absolute;top:0;left:0;width:100%;}
  .print-area .print-only{display:block!important;}
  .print-area .card{border:1px solid #000;box-shadow:none;}
  .print-area th, .print-area td{border-color:#999!important;}
}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ======================================================================
   POMOCNICZE
   ====================================================================== */
const uid = (p='id') => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const genToken = () => { const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };
/* WAŻNE: nigdy nie używamy tu toISOString() do dat kalendarzowych — ta metoda
   zwraca datę w UTC, co przy polskiej strefie czasowej (UTC+1/+2) potrafi
   przesunąć dzień o jeden wstecz (np. o 1:00 w nocy albo przy dodawaniu dnia).
   Zamiast tego budujemy datę z lokalnych składowych (rok/miesiąc/dzień). */
function toDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayStr = () => toDateStr(new Date());
const fmtDate = (d) => { if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'}); };
const fmtMonth = (m) => { if(!m) return '—'; const [y,mo]=m.split('-'); const dt=new Date(Number(y),Number(mo)-1,1); return dt.toLocaleDateString('pl-PL',{month:'long',year:'numeric'}); };
const esc = (s) => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const driverLinkFor = (token) => `${window.location.origin}${window.location.pathname}?kierowca=${token}`;
const orderLinkFor = (token) => `${window.location.origin}${window.location.pathname}?zamowienie=${token}`;

/* ======================================================================
   PRZECHOWYWANIE DANYCH (localStorage z awaryjnym fallbackiem w pamięci)
   ====================================================================== */
const PREFIX = 'ctn_app_v2_';
const memory = {};
const DB = { contractors: [], routes: [], employees: [], trips: [], fuel: [], vehicles: [], tanks: [], priceGroups: [], products: [], orders: [] };

/* Stanowiska pracowników. Stanowisko "Kierowca" włącza pracownika do
   modułu obrotu pojemników (trasy, link, historia tras). Stanowisko
   "Pracownik sprawdzający" włącza go do zatwierdzania wpisów. */
const POSITION_DRIVER = 'Kierowca';
const POSITION_CHECKER = 'Pracownik sprawdzający';
const POSITIONS = [POSITION_DRIVER, POSITION_CHECKER, 'Spedytor', 'Magazynier', 'Administracja', 'Inne'];
const CONTRACT_TYPES = ['Umowa o pracę', 'Umowa zlecenie', 'Umowa o dzieło', 'B2B', 'Inne'];
const isDriver = (e) => e && e.position === POSITION_DRIVER;
const isChecker = (e) => e && e.position === POSITION_CHECKER;
const driversList = () => DB.employees.filter(isDriver);
const checkersList = () => DB.employees.filter(isChecker);

function loadDB(){
  Object.keys(DB).forEach(key=>{
    let val = null;
    try{ const raw = localStorage.getItem(PREFIX+key); if(raw) val = JSON.parse(raw); }catch(e){}
    if(val===null) val = memory[key] || [];
    DB[key] = val;
  });
}
function persist(key){
  memory[key] = DB[key];
  try{ localStorage.setItem(PREFIX+key, JSON.stringify(DB[key])); }catch(e){}
}
loadDB();

/* ======================================================================
   UŻYTKOWNICY, UPRAWNIENIA I LOGOWANIE (Supabase Auth)
   ====================================================================== */
/* Klucze uprawnień odpowiadają modułom w głównym menu (TABS), plus
   uprawnienie "manageUsers" do zarządzania kontami. Dopóki nie istnieje
   żaden użytkownik (profil), aplikacja działa w trybie startowym —
   pozwala założyć pierwsze konto bez logowania. */
const PERMISSION_MODULES = [
  {key:'dashboard', label:'Pulpit'},
  {key:'kontrahenci', label:'Kontrahenci'},
  {key:'pojemniki', label:'Pojemniki'},
  {key:'zamowienia', label:'Zamówienia'},
  {key:'asortyment', label:'Asortyment'},
  {key:'kadry', label:'Kadry'},
  {key:'pojazdy', label:'Pojazdy'},
  {key:'paliwo', label:'Paliwo'},
  {key:'manageUsers', label:'Zarządzanie użytkownikami'},

const SUPABASE_URL = 'https://qowuldrrgjenxdgrqhnl.supabase.co';

function currentUser(){ return UI.currentUser || null; }
function hasPermission(key){
  if(bootstrapMode) return true;
  const u = currentUser();
  if(!u || u.active===false) return false;
  return !!(u.permissions && u.permissions[key]);
}

function mapProductFromDb(row){
  return {
    id: row.id, name: row.name, unit: row.unit,
    pieceKg: row.piece_kg===null||row.piece_kg===undefined ? '' : row.piece_kg,
    containerKg: row.container_kg===null||row.container_kg===undefined ? '' : row.container_kg,
    notes: row.notes || '',
  };
}
async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('name');
  if(!error) DB.products = (data||[]).map(mapProductFromDb);
}

async function callAdminUsersFn(action, payload){
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData && sessionData.session ? sessionData.session.access_token : '';
  const res = await fetch(ADMIN_USERS_FN_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      ...(token ? {'Authorization': 'Bearer '+token} : {}),
    },
    body: JSON.stringify({ action, ...payload }),
  });
  const out = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(out.error || ('Błąd serwera ('+res.status+')'));
  return out;
}

/* Wywoływane raz, przed pierwszym renderem: sprawdza tryb startowy
   i przywraca sesję, jeśli użytkownik był już zalogowany (Supabase Auth
   sam trzyma sesję w przeglądarce, więc to przetrwa odświeżenie strony). */
async function initAuth(){
  await refreshBootstrapMode();
  const { data: sessionData } = await sb.auth.getSession();
  const authedUser = sessionData && sessionData.session ? sessionData.session.user : null;
  if(authedUser){
    const { data: profile } = await sb.from('profiles').select('*').eq('id', authedUser.id).single();
    if(profile && profile.active!==false) UI.currentUser = profile;
    else await sb.auth.signOut();
  }
}

/* Wejście przez indywidualny link kierowcy: plik.html?kierowca=KOD
   Jeżeli link zawiera prawidłowy kod, użytkownik trafia od razu do
   swojego panelu kierowcy — bez żadnego logowania. W przeciwnym razie
   (brak parametru w adresie) system pokazuje panel administratora.
   Analogicznie działa link zamówień kontrahenta: plik.html?zamowienie=KOD */
(function resolveEntryPoint(){
  const params = new URLSearchParams(window.location.search);
  const driverToken = (params.get('kierowca') || params.get('driver') || '').trim().toUpperCase();
  const orderToken = (params.get('zamowienie') || params.get('order') || '').trim().toUpperCase();
  if(driverToken){
    const found = driversList().find(d => d.token === driverToken);
    if(found){
      UI.screen = 'driver';
      UI.driverId = found.id;
    } else {
      UI.screen = 'driver';
      UI.driverLinkInvalid = true;
    }
  } else if(orderToken){
    const found = DB.contractors.find(c => c.orderToken === orderToken);
    UI.screen = 'order-client';
    UI.orderContractorId = found ? found.id : null;
  }
})();

function computeContractorHistory(contractorId){
  const rows = [];
  DB.trips.forEach(t=>{
    t.entries.forEach(e=>{
      if(e.contractorId===contractorId){
        rows.push({
          id:e.id, date:t.date, time:e.time||'',
          driverName: (DB.employees.find(d=>d.id===t.driverId)||{}).name || '—',
          routeName: (DB.routes.find(r=>r.id===t.routeId)||{}).name || '—',
          left:e.left, taken:e.taken, approved:t.initialApproved,
        });
      }
    });
  });
  rows.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  return rows;
}
function computeContractorBalance(contractorId){
  let bal=0;
  DB.trips.forEach(t=> t.entries.forEach(e=>{ if(e.contractorId===contractorId) bal += e.left - e.taken; }));
  return bal;
}
function pendingTrips(){
  return DB.trips.filter(t=> !t.initialApproved || (t.finished && !t.finalApproved));
}

/* ---- Pulpit ---- */
function renderDashboard(){
  const today = todayStr();
  const todays = DB.trips.filter(t=>t.date===today);
  const pend = pendingTrips();
  const vehicleAlerts = computeVehicleAlerts();
  const stats = [
    {label:'Kontrahenci', value:DB.contractors.length, ic:'building'},
    {label:'Trasy', value:DB.routes.length, ic:'map'},
    {label:'Kierowcy', value:driversList().length, ic:'truck'},
    {label:'Trasy dzisiaj', value:todays.length, ic:'clipboard'},
  ];
  return `
  <div class="topbar"><div><h1>Pulpit</h1><p>Dziś jest ${fmtDate(today)}</p></div></div>
  <div class="page">
    <div class="stat-grid">
      ${stats.map(s=>`<div class="stat-card">${icon(s.ic,17,'#94a3b8')}<div class="n">${s.value}</div><div class="l">${s.label}</div></div>`).join('')}
    </div>
    ${pend.length>0 ? `
      <button data-action="goto-approvals" style="all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--amber-50);border:1px solid var(--amber-100);border-radius:14px;padding:14px 18px;margin-bottom:16px;width:100%;">
        ${icon('alert',18,'#b45309')}
        <span style="font-size:14px;color:#92400e;"><b>${pend.length}</b> ${pend.length===1?'wpis oczekuje':'wpisy/wpisów oczekują'} na zatwierdzenie przez pracownika sprawdzającego.</span>
      </button>`:''}
    ${vehicleAlerts.length>0 ? `
      <button data-action="tab" data-tab="pojazdy" style="all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--red-50);border:1px solid var(--red-100);border-radius:14px;padding:14px 18px;margin-bottom:28px;width:100%;">
        ${icon('alert',18,'#dc2626')}
        <span style="font-size:14px;color:#991b1b;"><b>${vehicleAlerts.length}</b> ${vehicleAlerts.length===1?'sprawa pojazdu wymaga':'spraw pojazdów wymaga'} uwagi (ubezpieczenie lub przegląd techniczny wygasa/wygasł).</span>
      </button>`:''}
    <h2 style="font-size:16px;font-weight:800;margin-bottom:12px;">Trasy dzisiaj</h2>
    ${todays.length===0 ? `<div class="card dashed"><div class="empty">${icon('truck',30)}<div class="t">Żaden kierowca nie rozpoczął dziś trasy</div></div></div>` : `
      <div class="grid-2">${todays.map(renderTripSummaryCard).join('')}</div>`}
  </div>`;
}

function renderTripSummaryCard(t){
  const driver = DB.employees.find(d=>d.id===t.driverId);
  const route = DB.routes.find(r=>r.id===t.routeId);
  const left = t.entries.reduce((s,e)=>s+e.left,0);
  const taken = t.entries.reduce((s,e)=>s+e.taken,0);
  const statusTone = t.finished ? (t.finalApproved?'emerald':'amber') : 'sky';
  const statusLabel = t.finished ? (t.finalApproved?'Zakończona':'Do zatwierdzenia') : 'W trasie';
  return `
  <div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div><b style="font-size:14px;">${esc(driver?.name||'Nieznany kierowca')}</b><div style="font-size:12px;color:var(--slate-500);">${esc(route?.name||'—')}</div></div>
      <span class="badge badge-${statusTone}">${statusLabel}</span>
    </div>
    <div class="chips">
      <span class="chip chip-slate">Pobrano: ${t.initialCount}${!t.initialApproved?' (niezatw.)':''}</span>
      <span class="chip chip-slate">Zostawiono: ${left}</span>
      <span class="chip chip-slate">Odebrano: ${taken}</span>
      ${t.finished?`<span class="chip chip-slate">Zwrot: ${t.finalCount}</span>`:''}
    </div>
  </div>`;
}

function renderPojemniki(){
  const pend = pendingTrips().length;
  const subtabsHtml = `
    <div style="padding:22px 32px 0;">
      <div class="subtabs">

/* ---- Grupy cenowe ---- */
function contractorPriceGroup(contractorId){
  const c = DB.contractors.find(x=>x.id===contractorId);
  return c && c.priceGroupId ? DB.priceGroups.find(g=>g.id===c.priceGroupId) : null;
}

function groupEffectivePrice(g, date, productId){
  const lists = g.priceLists || [];
  const candidates = lists.filter(pl => pl.startDate && pl.startDate<=date && (!pl.endDate || pl.endDate>=date));
  if(candidates.length>0){
    candidates.sort((a,b)=> b.startDate.localeCompare(a.startDate));
    const dated = (candidates[0].prices||{})[productId];
    if(dated!==undefined && dated!==null && dated!=='') return Number(dated);
  }
  const defPrice = (g.productPrices||{})[productId];
  return (defPrice===undefined || defPrice===null || defPrice==='') ? null : Number(defPrice);
}

function productPriceForContractor(product, contractorId, date){
  date = date || todayStr();
  const group = contractorPriceGroup(contractorId);
  if(!group) return null;
  return groupEffectivePrice(group, date, product.id);
}

function activePriceList(group, date){
  date = date || todayStr();
  const lists = group.priceLists || [];
  const candidates = lists.filter(pl => pl.startDate && pl.startDate<=date && (!pl.endDate || pl.endDate>=date));
  if(candidates.length===0) return null;
  candidates.sort((a,b)=> b.startDate.localeCompare(a.startDate));
  return candidates[0];
}

function priceListRangeLabel(pl){
  return pl.endDate ? `${fmtDate(pl.startDate)} – ${fmtDate(pl.endDate)}` : `od ${fmtDate(pl.startDate)}`;
}

/* Zbiornik cenników, których może być bardzo dużo (nawet inny na każdy dzień),
   przeglądamy dzień po dniu (jak w historii tankowań/zamówień), zamiast pokazywać
   długą listę wszystkich okresów naraz. */
function findExactListStartingOn(groupsScope, date){
  for(const g of groupsScope){
    const pl = (g.priceLists||[]).find(x=>x.startDate===date);
    if(pl) return true;
  }
  return false;
}

function renderPriceMatrix(){
  const matrixDate = UI.matrixDate || todayStr();
  const isToday = matrixDate===todayStr();
  const query = (UI.pricegroupProductQuery||'').toLowerCase();
  const products = DB.products.filter(p=>!query||p.name.toLowerCase().includes(query));

    return `<div class="card dashed"><div class="empty">${icon('tag',28)}<div class="t">Brak grup cenowych</div><div class="s">Dodaj przynajmniej jedną grupę cenową, aby zobaczyć zbiorczy cennik.</div></div></div>`;
  }

  const isExact = findExactListStartingOn(DB.priceGroups, matrixDate);
  // istniejąca data końcowa (jeśli którakolwiek grupa ma wpis zaczynający się dokładnie tego dnia z zakresem) — do wstępnego zaznaczenia przełącznika okresu
  let existingEndDate = '';
  if(isExact){
    for(const g of DB.priceGroups){
      const pl = (g.priceLists||[]).find(x=>x.startDate===matrixDate);
      if(pl && pl.endDate){ existingEndDate = pl.endDate; break; }
    }
  }

  const dayNav = `
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;">

      <button class="icon-btn" style="width:34px;height:34px;justify-content:center;flex-shrink:0;" data-action="matrix-date-nav" data-dir="1">${icon('arrowright',16)}</button>
    </div>
    ${!isToday ? `<button class="btn-ghost" data-action="matrix-date-today">Dziś</button>` : ''}
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:12px;color:var(--slate-400);">lub wybierz datę:</span>
      <input class="input" type="date" value="${matrixDate}" data-onchange="matrix-date-pick" style="max-width:150px;" />
    </div>
  </div>`;

  let banner;
  if(isExact){

function computeRouteHistory(routeId){
  const rows = [];
  DB.trips.filter(t=>t.routeId===routeId).forEach(t=>{
    t.entries.forEach(e=>{
      rows.push({
        id:e.id, date:t.date, time:e.time||'',
        driverName: (DB.employees.find(d=>d.id===t.driverId)||{}).name || '—',
        contractorName: (DB.contractors.find(c=>c.id===e.contractorId)||{}).name || '—',
        left:e.left, taken:e.taken, approved:t.initialApproved,
      });
    });
  });
  rows.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return rows;
}

function computeDriverHistory(driverId){
  return DB.trips
    .filter(t=>t.driverId===driverId)
    .map(t=>{
      const route = DB.routes.find(r=>r.id===t.routeId);
      const entries = t.entries.map(e=>({
        ...e,
        contractorName: (DB.contractors.find(c=>c.id===e.contractorId)||{}).name || '—',
      }));
      return {
        id:t.id, date:t.date, routeName: route?.name || '—',
        initialCount:t.initialCount, initialApproved:t.initialApproved,
        finished:t.finished, finalCount:t.finalCount, finalApproved:t.finalApproved,
        entries,
        totalLeft: entries.reduce((s,e)=>s+e.left,0),
        totalTaken: entries.reduce((s,e)=>s+e.taken,0),
      };
    })
    .sort((a,b)=> b.date.localeCompare(a.date));
}

function computeCheckerApprovals(checkerId){
  const rows = [];
  DB.trips.forEach(t=>{
    if(t.initialApprovedBy===checkerId) rows.push({tripId:t.id, date:t.date, kind:'Start dnia', value:t.initialCount, driverName:(DB.employees.find(d=>d.id===t.driverId)||{}).name||'—'});
    if(t.finalApprovedBy===checkerId) rows.push({tripId:t.id+'_f', date:t.date, kind:'Koniec dnia', value:t.finalCount, driverName:(DB.employees.find(d=>d.id===t.driverId)||{}).name||'—'});
  });
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

const LEAVE_TYPES = ['Wypoczynkowy', 'Na żądanie', 'Chorobowe', 'Okolicznościowy', 'Bezpłatny', 'Inne'];

function computeLeaveSummary(e){
  const entitlement = Number(e.leaveEntitlement)||26;
  const used = (e.leaves||[]).filter(l=>l.type==='Wypoczynkowy').reduce((s,l)=>s+(Number(l.days)||0),0);
  return { entitlement, used, remaining: entitlement-used };
}

function employeeLeaveBlock(e){
  const sum = computeLeaveSummary(e);
  const leaves = [...(e.leaves||[])].sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(r=>({...r,_delAction:'leave:delete'}));
  return `
  <div style="margin-bottom:30px;">
    <div class="counter-row" style="margin-bottom:18px;">
      <div class="counter-box tone-sky"><div class="v">${sum.entitlement}</div><div class="l">Limit roczny (dni)</div></div>
      <div class="counter-box tone-amber"><div class="v">${sum.used}</div><div class="l">Wykorzystano (wypoczynkowy)</div></div>
      <div class="counter-box tone-${sum.remaining<0?'amber':'emerald'}"><div class="v">${sum.remaining}</div><div class="l">Pozostało</div></div>

/* ---- Pojazdy ---- */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const ms = new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00');
  return Math.round(ms/86400000);
}
function dateStatus(dateStr){
  const days = daysUntil(dateStr);
  if(days===null) return {tone:'slate', label:'Brak danych'};
  if(days<0) return {tone:'red', label:'Przeterminowane'};
  if(days<=30) return {tone:'amber', label:'Wygasa wkrótce'};
  return {tone:'emerald', label:'Ważne'};
}
function latestByDate(list, field){
  if(!list || list.length===0) return null;
  return [...list].sort((a,b)=> (b[field]||'').localeCompare(a[field]||''))[0];
}
function computeVehicleAlerts(){
  const alerts = [];
  DB.vehicles.forEach(v=>{
    const ins = latestByDate(v.insurances,'endDate');
    const insp = latestByDate(v.inspections,'validUntil');
    if(ins && daysUntil(ins.endDate)!==null && daysUntil(ins.endDate)<=30) alerts.push({vehicleId:v.id, type:'insurance'});
    if(insp && daysUntil(insp.validUntil)!==null && daysUntil(insp.validUntil)<=30) alerts.push({vehicleId:v.id, type:'inspection'});
  });
  return alerts;
}

/* ---- Zamówienia ---- */
const ORDER_STATUSES = ['Nowe', 'Potwierdzone', 'Zrealizowane', 'Anulowane'];
function orderStatusTone(status){
  if(status==='Zrealizowane') return 'emerald';
  if(status==='Potwierdzone') return 'sky';
  if(status==='Anulowane') return 'red';
  return 'amber';
}
function orderTotalQty(order){
  return (order.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
}
function orderItemCount(order){
  return (order.items||[]).filter(it=>(Number(it.qty)||0)>0).length;
}
function shiftDay(dateStr, delta){
  const d = new Date((dateStr||todayStr())+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return toDateStr(d);
}
/* Domyślna data zbierania zamówień: kolejny dzień (zwykle jutro).
   Jedynym dniem nieroboczym jest niedziela — jeśli "jutro" wypada
   w niedzielę, proponujemy od razu poniedziałek. Sobota pozostaje
   normalnym dniem roboczym do zbierania zamówień. */
function nextOrderDay(baseDateStr){
  const d = new Date((baseDateStr||todayStr())+'T00:00:00');
  d.setDate(d.getDate()+1);
  if(d.getDay()===0) d.setDate(d.getDate()+1); // niedziela -> poniedziałek
  return toDateStr(d);
}
function fmtDayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const label = d.toLocaleDateString('pl-PL', {weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'});
  return label.charAt(0).toUpperCase()+label.slice(1);
}

}

function renderContractorAutocompleteResults(query){
  const q = query.trim().toLowerCase();
  if(!q) return '';
  const matches = DB.contractors.filter(c=>c.name.toLowerCase().includes(q)).slice(0,20);
  if(matches.length===0) return `<div class="autocomplete-empty">Brak kontrahentów pasujących do „${esc(query)}”.</div>`;
  return matches.map(c=>`<div class="autocomplete-item" data-action="order-contractor-pick" data-id="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}${c.city?` <span style="color:var(--slate-400);font-size:12px;">— ${esc(c.city)}</span>`:''}</div>`).join('');
}

function renderOrderSummaryTable(dayOrders, cursor){
  const cols = dayOrders
    .map(o=>({order:o, contractor: DB.contractors.find(c=>c.id===o.contractorId)}))
    .filter(x=>x.contractor)
    .sort((a,b)=>a.contractor.name.localeCompare(b.contractor.name));

  if(cols.length===0){
    return `<div class="card dashed"><div class="empty">${icon('cart',30)}<div class="t">Brak zamówień na ten dzień</div><div class="s">Tabela zbiorcza pojawi się tutaj, gdy przynajmniej jeden kontrahent złoży zamówienie na ten dzień.</div></div></div>`;
  }

  const usedProductIds = new Set();
  cols.forEach(({order})=> (order.items||[]).forEach(it=>{ if(Number(it.qty)>0) usedProductIds.add(it.productId); }));
  const products = DB.products.filter(p=>usedProductIds.has(p.id));

  if(products.length===0){
    return `<div class="card dashed"><div class="empty">${icon('cart',30)}<div class="t">Brak pozycji w zamówieniach tego dnia</div></div></div>`;
  }

  return `
  <p style="font-size:12px;color:var(--slate-500);margin:0 0 12px;">Kliknij w ilość, aby ją poprawić — poprzednia wartość zostanie przekreślona, a obok pojawi się nowa.</p>

    <div class="print-only" style="display:none;margin-bottom:14px;">
      <b style="font-size:16px;">${fmtDayLabel(cursor)}</b>
    </div>
    <div class="card" style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th style="position:sticky;left:0;background:var(--slate-50);white-space:nowrap;">Produkt</th>
            ${cols.map(({contractor})=>`<th class="r" style="white-space:nowrap;">${esc(contractor.name)}</th>`).join('')}
            <th class="r" style="white-space:nowrap;">Razem</th>
          </tr>
        </thead>
        <tbody>
          ${products.map(p=>{
            let rowTotal = 0;
            const cells = cols.map(({order})=>{
              const item = (order.items||[]).find(it=>it.productId===p.id);
              if(!item || !(Number(item.qty)>0)) return `<td class="r" style="color:var(--slate-300);">—</td>`;
              rowTotal += Number(item.qty);

              const isEditing = UI.summaryEditCell && UI.summaryEditCell.orderId===order.id && UI.summaryEditCell.productId===p.id;
              if(isEditing){
                return `<td class="r" style="white-space:nowrap;">
                  <input type="number" min="0" step="0.01" class="summary-cell-input mono" data-order-id="${order.id}" data-product-id="${p.id}"
                    value="${item.qty}" autofocus style="width:64px;text-align:right;border:1px solid var(--slate-400);border-radius:6px;padding:3px 5px;font-size:13px;font-weight:700;" />
                </td>`;
              }

              const hasCorrection = item.strikeQty!==undefined && item.strikeQty!==null && Number(item.strikeQty)!==Number(item.qty);
              const display = hasCorrection
                ? `<span style="text-decoration:line-through;color:var(--slate-400);margin-right:5px;">${item.strikeQty}</span><span style="font-weight:700;color:var(--red-600);">${item.qty}</span>`
                : `<span style="font-weight:700;">${item.qty}</span>`;
              return `<td class="r" data-action="summary-cell-edit" data-order-id="${order.id}" data-product-id="${p.id}" style="white-space:nowrap;cursor:pointer;" title="Kliknij, aby poprawić ilość">
                ${display}<span style="font-size:10px;color:var(--slate-400);font-weight:400;"> ${esc(item.unit||'kg')}</span>
              </td>`;
            }).join('');
            return `<tr>
              <td style="position:sticky;left:0;background:#fff;white-space:nowrap;"><b style="font-weight:600;">${esc(p.name)}</b></td>
              ${cells}
              <td class="r mono" style="font-weight:800;">${rowTotal}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function commitSummaryCellEdit(input){
  const orderId = input.dataset.orderId;
  const productId = input.dataset.productId;
  const order = DB.orders.find(o=>o.id===orderId);
  if(!order){ UI.summaryEditCell=null; return; }
  const item = (order.items||[]).find(it=>it.productId===productId);
  if(!item){ UI.summaryEditCell=null; render(); return; }
  const newQty = input.value==='' ? 0 : Number(input.value);
  if(newQty !== Number(item.qty)){
    if(item.strikeQty===undefined || item.strikeQty===null){
      item.strikeQty = item.qty; // zapisujemy pierwotną ilość tylko raz — przy pierwszej korekcie
    }
    item.qty = newQty;
    order.updatedAt = new Date().toISOString();
    persist('orders');
  }
  UI.summaryEditCell = null;
  render();
}

function productConversionLabel(p){
  const parts = [];

  if(p.containerKg) parts.push(`1 poj. = ${Number(p.containerKg).toFixed(2)} kg`);
  return parts.length ? parts.join(' · ') : '—';
}

/* ---- Paliwo (tylko panel administratora) ---- */
function tankPercent(t){
  return t.capacity>0 ? Math.max(0, Math.min(100, (t.currentLevel/t.capacity)*100)) : 0;
}
function tankTone(t){
  const pct = tankPercent(t);
  if(pct<=15) return 'red';
  if(pct<=30) return 'amber';
  return 'emerald';
}
function renderTankCard(t){
  const pct = tankPercent(t);
  const tone = tankTone(t);
  const barColor = tone==='red' ? 'var(--red-500)' : tone==='amber' ? 'var(--amber-500)' : 'var(--emerald-500)';
  return `
  <div class="card card-pad clickable" data-action="tank:open" data-id="${t.id}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>
        <p style="font-weight:700;font-size:15px;margin:0;">${esc(t.name)}</p>
        <p style="font-size:12px;color:var(--slate-500);margin:2px 0 0;">Pojemność: ${t.capacity} l</p>
      </div>
      <div style="display:flex;gap:2px;">
        <button class="icon-btn" data-action="tank:edit" data-id="${t.id}">${icon('pencil',14)}</button>
        <button class="icon-btn" data-action="tank:delete" data-id="${t.id}">${icon('trash',14)}</button>
      </div>
    </div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:8px;">
      <span class="mono" style="font-size:24px;font-weight:800;color:var(--slate-800);">${Number(t.currentLevel).toFixed(0)}</span>
      <span style="font-size:12px;color:var(--slate-400);">/ ${t.capacity} l</span>
      <span class="badge badge-${tone}" style="margin-left:auto;">${pct.toFixed(0)}%</span>
    </div>
    <div style="height:9px;border-radius:9999px;background:var(--slate-100);overflow:hidden;margin-bottom:14px;">
      <div style="height:100%;width:${pct}%;background:${barColor};"></div>
    </div>
    <button class="btn-ghost" style="width:100%;justify-content:center;" data-action="tank:delivery" data-id="${t.id}">${icon('plus',14)} Zarejestruj dostawę</button>
  </div>`;
}

function renderTankDetail(){
  const t = DB.tanks.find(x=>x.id===UI.openTankId);
  if(!t){ UI.openTankId=null; return renderFuel(); }
  const pct = tankPercent(t);

  const barColor = tone==='red' ? 'var(--red-500)' : tone==='amber' ? 'var(--amber-500)' : 'var(--emerald-500)';

  const deliveries = [...(t.deliveries||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalDelivered = deliveries.reduce((s,d)=>s+Number(d.liters||0),0);
  const fuelings = DB.fuel.filter(f=>f.tankId===t.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalConsumed = fuelings.reduce((s,f)=>s+Number(f.liters||0),0);

  return `
  <div class="page" style="padding-top:32px;">
    <button class="btn-ghost" style="margin-bottom:14px;" data-action="tank:back">${icon('arrowleft',15)} Wróć do listy zbiorników</button>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;">
      <div>
        <h1 style="font-size:24px;font-weight:800;margin:0;">${esc(t.name)}</h1>
        <p style="color:var(--slate-500);font-size:14px;margin:5px 0 0;">Pojemność: ${t.capacity} l</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" data-action="tank:delivery" data-id="${t.id}">${icon('plus',15)} Zarejestruj dostawę</button>
        <button class="btn-ghost" data-action="tank:edit" data-id="${t.id}">${icon('pencil',15)} Edytuj</button>
        <button class="btn-ghost red" data-action="tank:delete" data-id="${t.id}">${icon('trash',15)} Usuń</button>
      </div>
    </div>

    <div style="max-width:420px;margin-bottom:8px;">
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:8px;">
        <span class="mono" style="font-size:30px;font-weight:800;color:var(--slate-800);">${Number(t.currentLevel).toFixed(0)}</span>
        <span style="font-size:13px;color:var(--slate-400);">/ ${t.capacity} l</span>
        <span class="badge badge-${tone}" style="margin-left:auto;">${pct.toFixed(0)}%</span>
      </div>
      <div style="height:11px;border-radius:9999px;background:var(--slate-100);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${barColor};"></div>
      </div>
    </div>

    <div class="counter-row" style="margin:22px 0 30px;">
      <div class="counter-box tone-emerald"><div class="v">${totalDelivered.toFixed(0)}</div><div class="l">Łącznie dostarczono</div></div>
      <div class="counter-box tone-amber"><div class="v">${totalConsumed.toFixed(0)}</div><div class="l">Łącznie zatankowano</div></div>
      <div class="counter-box tone-sky"><div class="v">${deliveries.length}</div><div class="l">Liczba dostaw</div></div>
    </div>

    ${renderVehicleSection('Historia dostaw', 'fuel', 'tank:delivery', t.id, deliveries.map(d=>({...d,_delAction:'tank-delivery:delete'})), [
      {label:'Data', render:r=>fmtDate(r.date)},
      {label:'Litry', right:true, render:r=>Number(r.liters).toFixed(2)},
      {label:'Dostawca', render:r=>esc(r.supplier)||'—'},
      {label:'Koszt', right:true, render:r=>r.cost?`${Number(r.cost).toFixed(2)} zł`:'—'},
      {label:'Uwagi', render:r=>esc(r.notes)||'—'},
    ], 'Brak zarejestrowanych dostaw do tego zbiornika.')}

    <h2 style="font-size:15px;font-weight:800;margin:26px 0 12px;">Tankowania z tego zbiornika</h2>
    ${fuelings.length===0 ? `<div class="card dashed"><div class="empty">${icon('fuel',28)}<div class="t">Brak tankowań</div><div class="s">Wpisy pojawią się tutaj, gdy ktoś zatankuje z tego zbiornika.</div></div></div>` : `
    <div class="card" style="overflow:auto;">
      <table>
        <thead>${FUEL_TABLE_HEAD}</thead>
        <tbody>${fuelings.map(fuelRowTr).join('')}</tbody>
      </table>
    </div>`}
  </div>`;
}

function fuelRowTr(f){
  const driver = DB.employees.find(e=>e.id===f.employeeId);
  const vehicle = DB.vehicles.find(v=>v.id===f.vehicleId);
  const plateLabel = vehicle?.plate || f.customPlate || '—';
  const isExternal = f.kind==='zewnetrzne';
  const tank = DB.tanks.find(t=>t.id===f.tankId);
  const priceL = f.liters>0 ? (f.cost/f.liters) : 0;
  return `<tr>
    <td>${fmtDate(f.date)}</td>
    <td><span class="badge badge-${isExternal?'amber':'slate'}">${isExternal?'Zewnętrzne':'Wewnętrzne'}</span></td>
    <td><b style="font-weight:600;">${esc(plateLabel)}</b>${!vehicle && f.customPlate ? ` <span style="font-size:11px;color:var(--slate-400);">(spoza listy)</span>`:''}</td>
    <td>${esc(driver?.name)||'—'}</td>
    <td style="color:var(--slate-500);">${esc(tank?.name)||'—'}</td>
    <td class="r mono">${Number(f.liters).toFixed(2)}</td>
    <td class="r mono">${f.cost ? Number(f.cost).toFixed(2)+' zł' : '—'}</td>
    <td class="r mono" style="color:var(--slate-500);">${f.cost ? priceL.toFixed(2)+' zł' : '—'}</td>
    <td class="r mono" style="color:var(--slate-500);">${f.odometer ? f.odometer+' km' : '—'}</td>
    <td style="color:var(--slate-500);">${esc(f.notes)||'—'}</td>
    <td class="r"><button class="icon-btn" data-action="fuel:edit" data-id="${f.id}">${icon('pencil',15)}</button></td>
  </tr>`;
}

const FUEL_TABLE_HEAD = `<tr><th>Data</th><th>Rodzaj</th><th>Pojazd</th><th>Kierowca</th><th>Zbiornik</th><th class="r">Litry</th><th class="r">Kwota</th><th class="r">Cena/l</th><th class="r">Przebieg</th><th>Uwagi</th><th></th></tr>`;

function shiftMonth(monthStr, delta){
  const [y,m] = (monthStr||todayStr().slice(0,7)).split('-').map(Number);
  const d = new Date(y, (m-1)+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function renderFuel(){
  if(UI.openTankId) return renderTankDetail();
  const kindFilter = UI.fuelKindFilter;
  const view = UI.fuelView;
  const cursor = UI.fuelMonthCursor || todayStr().slice(0,7);
  const isCurrentMonth = cursor === todayStr().slice(0,7);

  let rows;
  if(view==='months'){
    rows = DB.fuel.filter(f=>(f.date||'').slice(0,7)===cursor);
  } else {
    rows = [...DB.fuel];
    if(UI.fuelDateFrom) rows = rows.filter(f=>f.date >= UI.fuelDateFrom);
    if(UI.fuelDateTo) rows = rows.filter(f=>f.date <= UI.fuelDateTo);
  }
  if(kindFilter) rows = rows.filter(f=>(f.kind||'wewnetrzne')===kindFilter);
  rows.sort((a,b)=> b.date.localeCompare(a.date));

  const totalLiters = rows.reduce((s,f)=>s+Number(f.liters||0),0);
  const totalCost = rows.reduce((s,f)=>s+Number(f.cost||0),0);
  const litersWithCost = rows.filter(f=>Number(f.cost||0)>0).reduce((s,f)=>s+Number(f.liters||0),0);
  const avgPrice = litersWithCost>0 ? (totalCost/litersWithCost) : 0;
  const filtersActive = view==='list' && (UI.fuelDateFrom || UI.fuelDateTo || kindFilter);

  return `
  <div class="topbar">
    <div><h1>Paliwo</h1><p>Zbiorniki firmowe i ewidencja tankowań — widoczna wyłącznie w panelu administratora</p></div>
    <div style="display:flex;gap:8px;">
      <button class="btn-ghost" data-action="tank:new">${icon('plus',15)} Nowy zbiornik</button>
      <button class="btn btn-primary" data-action="fuel:new">${icon('plus',16)} Dodaj tankowanie</button>
    </div>
  </div>
  <div class="page">
    <h2 style="font-size:15px;font-weight:800;margin-bottom:12px;">Zbiorniki paliwa</h2>
    ${DB.tanks.length===0 ? `<div class="card dashed" style="margin-bottom:28px;"><div class="empty">${icon('fuel',28)}<div class="t">Brak zbiorników</div><div class="s">Dodaj zbiornik, aby móc rejestrować z niego tankowania.</div></div></div>` : `
    <div class="grid-2" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-bottom:30px;">${DB.tanks.map(renderTankCard).join('')}</div>`}

    <h2 style="font-size:15px;font-weight:800;margin-bottom:12px;">Historia tankowań</h2>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;">
      ${view==='months' ? `
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="icon-btn" style="border:1px solid var(--slate-200);border-radius:8px;" data-action="fuel-month-nav" data-dir="-1">${icon('arrowleft',16)}</button>
        <div style="min-width:170px;text-align:center;font-weight:700;font-size:14px;text-transform:capitalize;">${fmtMonth(cursor)}</div>
        <button class="icon-btn" style="border:1px solid var(--slate-200);border-radius:8px;" data-action="fuel-month-nav" data-dir="1">${icon('arrowright',16)}</button>
        ${!isCurrentMonth ? `<button class="btn-ghost" data-action="fuel-month-today">Bieżący miesiąc</button>` : ''}
      </div>
      <label class="field" style="margin:0;"><span class="lab">Rodzaj</span>
        <select class="input" data-onchange="fuel-kind-filter" style="max-width:170px;">
          <option value="">Wszystkie</option>
          <option value="wewnetrzne" ${kindFilter==='wewnetrzne'?'selected':''}>Wewnętrzne</option>
          <option value="zewnetrzne" ${kindFilter==='zewnetrzne'?'selected':''}>Zewnętrzne</option>
        </select>
      </label>` : `
      <label class="field" style="margin:0;"><span class="lab">Data od</span><input class="input" type="date" value="${UI.fuelDateFrom}" data-onchange="fuel-date-from" style="max-width:150px;" /></label>
      <label class="field" style="margin:0;"><span class="lab">Data do</span><input class="input" type="date" value="${UI.fuelDateTo}" data-onchange="fuel-date-to" style="max-width:150px;" /></label>
      <label class="field" style="margin:0;"><span class="lab">Rodzaj</span>
        <select class="input" data-onchange="fuel-kind-filter" style="max-width:170px;">
          <option value="">Wszystkie</option>
          <option value="wewnetrzne" ${kindFilter==='wewnetrzne'?'selected':''}>Wewnętrzne</option>
          <option value="zewnetrzne" ${kindFilter==='zewnetrzne'?'selected':''}>Zewnętrzne</option>
        </select>
      </label>
      ${filtersActive ? `<button class="btn-ghost" data-action="fuel-filters-clear">${icon('x',13)} Wyczyść filtry</button>` : ''}`}
      <div style="margin-left:auto;display:flex;gap:4px;background:var(--slate-100);padding:3px;border-radius:10px;">
        <button data-action="fuel-view" data-view="months" style="border:none;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:${view==='months'?'#fff':'transparent'};color:${view==='months'?'var(--slate-900)':'var(--slate-500)'};box-shadow:${view==='months'?'0 1px 2px rgba(0,0,0,.08)':'none'};">Wg miesięcy</button>
        <button data-action="fuel-view" data-view="list" style="border:none;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:${view==='list'?'#fff':'transparent'};color:${view==='list'?'var(--slate-900)':'var(--slate-500)'};box-shadow:${view==='list'?'0 1px 2px rgba(0,0,0,.08)':'none'};">Własny zakres dat</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">${icon('fuel',17,'#94a3b8')}<div class="n">${totalLiters.toFixed(2)} l</div><div class="l">Łącznie zatankowano</div></div>
      <div class="stat-card">${icon('fuel',17,'#94a3b8')}<div class="n">${totalCost.toFixed(2)} zł</div><div class="l">Łączny koszt</div></div>
      <div class="stat-card">${icon('fuel',17,'#94a3b8')}<div class="n">${avgPrice.toFixed(2)} zł</div><div class="l">Śr. cena za litr</div></div>
      <div class="stat-card">${icon('fuel',17,'#94a3b8')}<div class="n">${rows.length}</div><div class="l">Liczba tankowań</div></div>
    </div>

    ${rows.length===0 ? `<div class="card dashed"><div class="empty">${icon('fuel',30)}<div class="t">Brak wpisów paliwowych</div><div class="s">${view==='months' ? `Brak tankowań w miesiącu: ${fmtMonth(cursor)}.` : (filtersActive ? 'Żaden wpis nie pasuje do wybranych filtrów.' : 'Dodaj pierwsze tankowanie, aby rozpocząć ewidencję.')}</div></div></div>` : `
    <div class="card" style="overflow:auto;">
      <table>
        <thead>${FUEL_TABLE_HEAD}</thead>
        <tbody>${rows.map(fuelRowTr).join('')}</tbody>
      </table>
    </div>`}
  </div>`;
}

        </div>

              <input type="checkbox" name="perm_${pm.key}" ${perms[pm.key]?'checked':''} style="width:16px;height:16px;flex-shrink:0;" />

          ${u.id?`<button type="button" class="btn-ghost red" data-action="user:delete" data-id="${u.id}">${icon('trash',15)} Usuń</button>`:'<span></span>'}

        </div>

    return wrapModal(e.id?'Edytuj pracownika':'Nowy pracownik', `

          <label class="field"><span class="lab">Stanowisko</span>
            <select class="input" name="position">${options}</select>
          </label>
          <label class="field"><span class="lab">Typ umowy</span>
            <select class="input" name="contractType">${contractTypeOptions}</select>
          </label>
        </div>
        <p style="font-size:12px;color:var(--slate-500);margin:-6px 0 14px;">Stanowisko „Kierowca” włącza pracownika do modułu obrotu pojemników i generuje mu indywidualny link. Stanowisko „Pracownik sprawdzający” pozwala mu zatwierdzać wpisy kierowców.</p>

        <label class="field"><span class="lab">Status pracownika</span>
          <input type="hidden" name="status" id="empStatusHidden" value="${isInactive?'Nie pracuje':'Aktywny'}" />
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

              <span class="s">Pracuje obecnie</span>
            </button>
            <button type="button" class="fuel-kind-tile ${isInactive?'active':''}" id="empStatusTileInactive" data-action="employee-status-select" data-value="Nie pracuje">
              <span class="t">Nie pracuje</span>
              <span class="s">Zakończył współpracę</span>
            </button>
          </div>
        </label>
        <div class="grid-2">
          <label class="field"><span class="lab">Data rozpoczęcia pracy</span><input class="input" type="date" name="employmentStartDate" value="${e.employmentStartDate||''}" /></label>

          <label class="field"><span class="lab">Prawo jazdy ważne do</span><input class="input" type="date" name="licenseValidUntil" value="${e.licenseValidUntil||''}" /></label>
        </div>
        <label class="field"><span class="lab">Dowód osobisty ważny do</span><input class="input" type="date" name="idValidUntil" value="${e.idValidUntil||''}" /></label>
        <label class="field"><span class="lab">Roczny limit urlopu (dni)</span><input class="input" type="number" min="0" name="leaveEntitlement" value="${e.leaveEntitlement??26}" /></label>

        <div class="modal-actions">
          ${e.id?`<button type="button" class="btn-ghost red" data-action="employee:delete" data-id="${e.id}">${icon('trash',15)} Usuń</button>`:'<span></span>'}
          <button type="submit" class="btn btn-primary">Zapisz</button>
        </div>
      </form>`);

  if(m.type==='driver-link'){

    return wrapModal(`Link dla: ${esc(d.name)}`, `
      <p style="font-size:14px;color:var(--slate-500);margin:0 0 16px;">Wyślij kierowcy poniższy link (np. SMS-em). Po jego otwarciu na telefonie kierowca trafia od razu do swojego panelu — bez logowania i bez wpisywania kodu.</p>
      <label class="field"><span class="lab">Indywidualny link kierowcy</span>
        <div style="display:flex;gap:8px;">
          <input class="input mono" style="font-size:13px;" readonly value="${esc(link)}" id="linkField" />
          <button type="button" class="btn-ghost" data-action="copy" data-text="${esc(link)}">${icon('copy',16)}</button>
        </div>
      </label>
      <label class="field"><span class="lab">Treść wiadomości do wysłania</span>
        <textarea class="input" rows="3" readonly>${esc(msg)}</textarea>
        <button type="button" class="btn-ghost" style="margin-top:4px;padding-left:0;" data-action="copy" data-text="${esc(msg)}">Kopiuj treść</button>
      </label>
      <p style="font-size:11px;color:var(--slate-400);margin:14px 0 0;">Kod techniczny (jeśli wolisz podać go ręcznie): <span class="mono">${d.token}</span></p>`);

          <button type="submit" class="btn btn-primary">Dalej</button>
        </div>

      <form data-form="product" data-id="${p.id||''}">
        <label class="field"><span class="lab">Nazwa produktu</span><input class="input" name="name" value="${esc(p.name)}" required autofocus /></label>

          </select>

          <label class="field"><span class="lab">1 sztuka ≈ ile kg</span><input class="input" type="number" min="0" step="0.01" name="pieceKg" value="${p.pieceKg??''}" placeholder="np. 0.5" /></label>

        <p style="font-size:12px;color:var(--slate-500);margin:-6px 0 14px;">Przeliczniki są opcjonalne — uzupełnij tylko te, które mają zastosowanie do tego produktu. Pojemnik domyślnie liczony jest jako 15 kg.</p>
        <label class="field"><span class="lab">Uwagi</span><input class="input" name="notes" value="${esc(p.notes)}" /></label>
        <div class="modal-actions">
          ${p.id?`<button type="button" class="btn-ghost red" data-action="product:delete" data-id="${p.id}">${icon('trash',15)} Usuń</button>`:'<span></span>'}
          <button type="submit" class="btn btn-primary">Zapisz</button>
        </div>
      </form>`);

  if(m.type==='product-bulk'){
    return wrapModal('Dodaj wiele produktów naraz', `

      <form data-form="product-bulk">

        <div class="modal-actions" style="justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Dodaj produkty</button>
        </div>
      </form>`);

  if(m.type==='fuel'){
    const f = m.data;

    const isInny = !isExternal && !f.vehicleId && !!f.customPlate;
    const driverOptions = driversList().map(dr=>`<option value="${dr.id}" ${f.employeeId===dr.id?'selected':''}>${esc(dr.name)}</option>`).join('');
    const vehicleOptions = DB.vehicles.map(v=>`<option value="${v.id}" ${f.vehicleId===v.id?'selected':''}>${esc(v.plate)}${v.brand?` — ${esc(v.brand)} ${esc(v.model||'')}`:''}</option>`).join('');

      <form data-form="fuel" data-id="${f.id||''}">
        <label class="field"><span class="lab">Rodzaj tankowania</span>
          <input type="hidden" name="kind" id="fuelKindHidden" value="${isExternal?'zewnetrzne':'wewnetrzne'}" />
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <button type="button" class="fuel-kind-tile ${!isExternal?'active':''}" id="fuelKindTileInternal" data-action="fuel-kind-select" data-value="wewnetrzne">
              <span class="t">Wewnętrzne</span>
              <span class="s">Pojazd firmowy</span>

            <button type="button" class="fuel-kind-tile ${isExternal?'active':''}" id="fuelKindTileExternal" data-action="fuel-kind-select" data-value="zewnetrzne">

              <span class="s">Sprzedaż paliwa</span>

              <option value="__other__" ${isInny?'selected':''}>Inny (wpisz numer ręcznie)</option>
            </select>

            <input class="input" name="customPlateInny" id="fuelInnyPlateInput" value="${isInny?esc(f.customPlate):''}" placeholder="np. GD 12345 EF" ${isInny?'required':''} />

            <input class="input" name="customPlateExternal" id="fuelExternalPlateInput" value="${isExternal?esc(f.customPlate):''}" placeholder="np. GD 12345 EF" ${isExternal?'required':''} />
          </label>

          <input type="hidden" name="tankId" id="fuelTankHidden" value="${f.tankId||''}" />

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
            ${DB.tanks.map(t=>`
              <button type="button" class="fuel-kind-tile fuel-tank-tile ${f.tankId===t.id?'active':''}" data-action="fuel-tank-select" data-value="${t.id}">
                <span class="t">${esc(t.name)}</span>

          </label>
          <label class="field"><span class="lab">Data</span><input class="input" type="date" name="date" value="${f.date||todayStr()}" required /></label>
        </div>
        <div class="grid-2">

        <label class="field" id="fuelCostWrap"><span class="lab" id="fuelCostLabel">Kwota (zł)${isExternal?' — wymagana':' — opcjonalna'}</span><input class="input" type="number" min="0" step="0.01" name="cost" id="fuelCostInput" value="${f.cost??''}" ${isExternal?'required':''} /></label>

        <div class="modal-actions">

        </div>
      </form>`);

  if(m.type==='tank'){

    return wrapModal(t.id?'Edytuj zbiornik':'Nowy zbiornik', `
      <form data-form="tank" data-id="${t.id||''}">

          <label class="field"><span class="lab">Dostawca</span><input class="input" name="supplier" /></label>
          <label class="field"><span class="lab">Koszt (zł)</span><input class="input" type="number" min="0" step="0.01" name="cost" /></label>

        <label class="field"><span class="lab">Uwagi</span><input class="input" name="notes" /></label>
        <div class="modal-actions" style="justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Zapisz dostawę</button>
        </div>
      </form>`);
  }

  if(m.type==='vehicle'){
    const v = m.data;
    const driverOptions = driversList().map(dr=>`<option value="${dr.id}" ${v.driverId===dr.id?'selected':''}>${esc(dr.name)}</option>`).join('');
    return wrapModal(v.id?'Edytuj pojazd':'Nowy pojazd', `
      <form data-form="vehicle" data-id="${v.id||''}">
        <label class="field"><span class="lab">Nr rejestracyjny</span><input class="input" name="plate" value="${esc(v.plate)}" required autofocus /></label>
        <div class="grid-2">
          <label class="field"><span class="lab">Marka</span><input class="input" name="brand" value="${esc(v.brand)}" /></label>
          <label class="field"><span class="lab">Model</span><input class="input" name="model" value="${esc(v.model)}" /></label>

function renderDriverHeader(title){
  return `<div class="driver-header"><div class="t">${icon('truck',17,'#fbbf24')} ${esc(title)}</div></div>`;

function renderDriverScreen(){
  const driver = DB.employees.find(d=>d.id===UI.driverId);
  if(!driver){
    return `
    <div class="driver-page"><div class="driver-shell">
      ${renderDriverHeader('Panel kierowcy')}
      <div class="driver-body">
        <div class="dcenter">
          <div class="dlogo">${icon('alert',26,'#fbbf24')}</div>
          <h1 style="font-size:20px;font-weight:800;margin:0 0 4px;">Nieprawidłowy lub nieaktualny link</h1>
          <p style="font-size:13px;color:var(--slate-500);margin:0 0 4px;max-width:280px;">Ten link kierowcy nie pasuje do żadnego konta w systemie. Poproś administratora o ponowne wysłanie linku z zakładki „Kierowcy”.</p>
        </div>
      </div>
    </div></div>`;
  }
  const today = todayStr();
  const trip = DB.trips.find(t=>t.driverId===driver.id && t.date===today);

  if(!trip) return renderDriverStart(driver);
  if(trip.finished) return renderDriverFinished(driver, trip);
  return renderDriverActive(driver, trip);
}

function renderDriverActive(driver, trip){
  const route = DB.routes.find(r=>r.id===trip.routeId);
  const routeContractors = (route?.contractorIds||[]).map(id=>DB.contractors.find(c=>c.id===id)).filter(Boolean);
  const totalLeft = trip.entries.reduce((s,e)=>s+e.left,0);
  const totalTaken = trip.entries.reduce((s,e)=>s+e.taken,0);

  return `
  <div class="driver-page"><div class="driver-shell">
    ${renderDriverHeader(driver.name)}
    <div class="driver-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
        <p class="eyebrow" style="margin:0;">${fmtDate(trip.date)}</p>
        <span class="badge badge-${trip.initialApproved?'emerald':'amber'}">${trip.initialApproved?'Start zatwierdzony':'Start: oczekuje'}</span>
      </div>
      <h1 style="font-size:20px;font-weight:800;margin:6px 0 16px;">${esc(route?.name)}</h1>
      <div class="counter-row" style="margin-bottom:22px;">
        <div class="counter-box tone-amber" style="flex:1;"><div class="v">${trip.initialCount}</div><div class="l">Pobrano</div></div>
        <div class="counter-box tone-sky" style="flex:1;"><div class="v">${totalLeft}</div><div class="l">Zostawiono</div></div>
        <div class="counter-box tone-emerald" style="flex:1;"><div class="v">${totalTaken}</div><div class="l">Odebrano</div></div>
      </div>
      <h2 style="font-size:14px;font-weight:800;margin-bottom:8px;">Kontrahenci na trasie</h2>
      ${routeContractors.length===0 ? `<p style="text-align:center;color:var(--slate-400);font-size:14px;padding:24px 0;">Ta trasa nie ma przypisanych kontrahentów.</p>` :
        routeContractors.map(c=>{
          const entry = trip.entries.find(e=>e.contractorId===c.id);
          const destination = [c.address, c.city].filter(Boolean).join(', ');
          const mapsUrl = destination ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=driving` : '';
          return `<div class="contractor-card">
            <div class="top">
              <div><b>${esc(c.name)}</b><br/><small>${esc(c.city)}</small></div>
              ${entry ? icon('check',18,'#10b981') : ''}
            </div>
            ${entry ? `<div class="chips" style="margin-top:8px;"><span class="chip chip-sky">+${entry.left} zostawiono</span><span class="chip chip-emerald">-${entry.taken} odebrano</span></div>` : ''}
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button style="flex:2;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--slate-900);color:#fff;border:none;padding:9px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;" data-action="driver:visit-open" data-cid="${c.id}">
                ${entry?'Edytuj wizytę':'Odwiedź'}
              </button>
              ${mapsUrl ? `
              <a href="${mapsUrl}" target="_blank" rel="noopener" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--slate-50);color:var(--slate-700);border:1px solid var(--slate-200);text-decoration:none;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;">
                ${icon('map',13,'#64748b')} Nawiguj
              </a>` : `<span style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--slate-300);border:1px dashed var(--slate-200);border-radius:9px;font-size:10px;padding:4px;">Brak adresu</span>`}
            </div>
          </div>`;
        }).join('')
      }
    </div>
    <div class="driver-footer"><div class="driver-footer-inner">
      <button class="btn btn-primary btn-full" data-action="driver:finish-open">Zakończ dzień</button>
    </div></div>
  </div></div>
  ${UI.driverVisitContractorId ? renderVisitModal(trip, routeContractors.find(c=>c.id===UI.driverVisitContractorId)) : ''}
  ${UI.driverFinishing ? renderFinishModal() : ''}
  `;
}

function renderVisitModal(trip, contractor){
  if(!contractor) return '';
  const entry = trip.entries.find(e=>e.contractorId===contractor.id);
  const balance = computeContractorBalance(contractor.id);
  const view = UI.driverVisitView || 'form';

  const subtabsHtml = `
    <div class="subtabs" style="margin:0 0 14px;">
      <button class="subtab ${view==='form'?'active':''}" data-action="driver-visit:view" data-view="form">${icon('id',14)} Wizyta</button>
      <button class="subtab ${view==='history'?'active':''}" data-action="driver-visit:view" data-view="history">${icon('clock',14)} Historia</button>
    </div>`;

  const balanceHtml = `
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--slate-50);border-radius:10px;padding:10px 14px;margin-bottom:16px;">
      <span style="font-size:12px;color:var(--slate-500);">Aktualny stan pojemników u kontrahenta</span>
      <span class="badge badge-${balance>0?'amber':'slate'}" style="font-size:13px;">${balance} szt.</span>
    </div>`;

  let bodyHtml;
  if(view==='history'){
    const history = computeContractorHistory(contractor.id);
    bodyHtml = history.length===0
      ? `<p style="font-size:13px;color:var(--slate-400);text-align:center;padding:20px 0;">Brak historii wizyt u tego kontrahenta.</p>`
      : `<div style="display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;">
          ${history.map(h=>`
            <div style="border:1px solid var(--slate-200);border-radius:10px;padding:10px 12px;">
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--slate-500);margin-bottom:6px;">
                <span>${fmtDate(h.date)}</span><span>${esc(h.driverName)}</span>
              </div>
              <div class="chips">
                <span class="chip chip-sky">+${h.left} przywieziono</span>
                <span class="chip chip-emerald">-${h.taken} zabrano</span>
                ${!h.approved?`<span class="chip chip-slate">oczekuje zatw.</span>`:''}
              </div>
            </div>`).join('')}
        </div>`;
  } else {
    bodyHtml = `
      <form data-form="visit" data-cid="${contractor.id}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;">
          <div style="background:var(--sky-50);border:2px solid var(--sky-100);border-radius:14px;padding:16px 10px;text-align:center;">
            <div style="font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--sky-700);margin-bottom:10px;">PRZYWOŻĘ</div>
            <input class="mono" type="number" min="0" inputmode="numeric" name="left" value="${entry?entry.left:''}" placeholder="0" required autofocus
              style="width:100%;text-align:center;font-size:32px;font-weight:800;border:none;background:transparent;padding:0;color:var(--sky-700);" />
          </div>
          <div style="background:var(--emerald-50);border:2px solid var(--emerald-100);border-radius:14px;padding:16px 10px;text-align:center;">
            <div style="font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--emerald-700);margin-bottom:10px;">ZABIERAM</div>
            <input class="mono" type="number" min="0" inputmode="numeric" name="taken" value="${entry?entry.taken:''}" placeholder="0" required
              style="width:100%;text-align:center;font-size:32px;font-weight:800;border:none;background:transparent;padding:0;color:var(--emerald-700);" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Zapisz wizytę</button>
      </form>`;
  }

  return wrapModal(esc(contractor.name), `
    <p style="font-size:12px;color:var(--slate-500);margin:-8px 0 14px;">${esc(contractor.address)}, ${esc(contractor.city)}</p>
    ${balanceHtml}
    ${subtabsHtml}
    ${bodyHtml}`);
}

function renderDriverFinished(driver, trip){
  const route = DB.routes.find(r=>r.id===trip.routeId);
  const totalLeft = trip.entries.reduce((s,e)=>s+e.left,0);
  const totalTaken = trip.entries.reduce((s,e)=>s+e.taken,0);
  return `
  <div class="driver-page"><div class="driver-shell">
    ${renderDriverHeader(driver.name)}
    <div class="driver-body">
      <div class="dcenter" style="padding-top:20px;">
        ${icon('check',36,'#10b981')}
        <h1 style="font-size:20px;font-weight:800;margin:10px 0 2px;">Dzień zakończony</h1>
        <p style="font-size:13px;color:var(--slate-500);">${esc(route?.name)} · ${fmtDate(trip.date)}</p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;">
        <div class="counter-box tone-amber"><div class="v">${trip.initialCount}</div><div class="l">Pobrano</div></div>
        <div class="counter-box tone-sky"><div class="v">${trip.finalCount}</div><div class="l">Zwrócono</div></div>
        <div class="counter-box tone-sky"><div class="v">${totalLeft}</div><div class="l">Zostawiono</div></div>
        <div class="counter-box tone-emerald"><div class="v">${totalTaken}</div><div class="l">Odebrano</div></div>
      </div>
      <div class="status-line ${trip.initialApproved?'ok':'wait'}"><span>Ilość początkowa</span><span class="badge badge-${trip.initialApproved?'emerald':'amber'}">${trip.initialApproved?'Zatwierdzona':'Oczekuje'}</span></div>
      <div class="status-line ${trip.finalApproved?'ok':'wait'}"><span>Ilość końcowa</span><span class="badge badge-${trip.finalApproved?'emerald':'amber'}">${trip.finalApproved?'Zatwierdzona':'Oczekuje'}</span></div>
      <button class="dlink-faint" data-action="driver:reset-today">${icon('reset',12)} Zresetuj dzisiejszy dzień (tryb testowy)</button>
    </div>
  </div></div>`;
}

/* ======================================================================
   GŁÓWNY RENDER
   ====================================================================== */
function render(){
  if(UI.screen==='admin'){
    root.innerHTML = authRequired() ? renderLoginScreen() : renderAdmin();
  }
  else if(UI.screen==='order-client') root.innerHTML = renderOrderClientScreen();
  else root.innerHTML = renderDriverScreen();

  // po wyrenderowaniu: focus na polu wyszukiwania trasy podglądu, jeśli trzeba
  const routeSelect = document.getElementById('startRouteSelect');
  if(routeSelect){ updateRoutePreview(routeSelect.value); }
}

function updateRoutePreview(routeId){
  const el = document.getElementById('routePreview');
  if(!el) return;
  const route = DB.routes.find(r=>r.id===routeId);
  el.innerHTML = route ? `<div class="dhint">Trasa obejmuje ${route.contractorIds.length} kontrahentów.</div>` : '';
}

  UI.driverFinishing = false;
}

      const emp = DB.employees.find(x=>x.id===el.dataset.vehicle);

    }

    case 'approve': {
      const trip = DB.trips.find(t=>t.id===el.dataset.trip);
      const kind = el.dataset.kind;
      const sel = document.getElementById(`checkerSel_${el.dataset.trip}_${kind}`);
      const checkerId = sel ? sel.value : '';
      if(!checkerId) break;
      if(kind==='initial'){ trip.initialApproved=true; trip.initialApprovedBy=checkerId; trip.initialApprovedAt=new Date().toISOString(); }
      else { trip.finalApproved=true; trip.finalApprovedBy=checkerId; trip.finalApprovedAt=new Date().toISOString(); }
      persist('trips'); render(); break;
    }

    case 'modal:close': closeAnyModal(); render(); break;
    case 'copy': {
