root.addEventListener('input', function(e){
  const t = e.target;
  if(t.id==='orderContractorSearch'){
    const hidden = document.getElementById('orderContractorHidden');
    const box = document.getElementById('orderContractorResults');
    if(hidden) hidden.value = ''; // wpisywanie unieważnia wcześniejszy wybór, dopóki nie wybierze się ponownie z listy
    if(!box) return;
    const q = t.value;
    if(!q.trim()){ box.style.display='none'; box.innerHTML=''; return; }
    box.innerHTML = renderContractorAutocompleteResults(q);
    box.style.display = 'block';
  }
});

root.addEventListener('change', async function(e){
  const t = e.target;
  const onchange = t.dataset.onchange;
  if(!onchange) return;
  if(onchange==='fuel-vehicle-select-change'){
    const isInny = t.value==='__other__';
    const wrap = document.getElementById('fuelInnyPlateWrap');
    const input = document.getElementById('fuelInnyPlateInput');
    if(wrap) wrap.style.display = isInny ? '' : 'none';
    if(input){ input.required = isInny; if(!isInny) input.value=''; }
    return;
  }
  if(onchange==='employee-files'){
    if(!t.files || t.files.length===0) return;
    const employeeId = t.dataset.employee;
    const category = t.dataset.category;
    const emp = DB.employees.find(x=>x.id===employeeId);
    if(!emp) return;
    const newFiles = await processFileList(t.files);
    if(newFiles.length===0) return;
    emp[category] = [...(emp[category]||[]), ...newFiles];
    persist('employees');
    render();
    return;
  }
  if(onchange==='contractor-search'){ UI.contractorQuery = t.value; render(); document.getElementById('contractorSearch')?.focus(); }
  else if(onchange==='contractor-route-filter'){ UI.contractorRouteFilter = t.value; render(); }
  else if(onchange==='route-rename'){ const r = DB.routes.find(x=>x.id===t.dataset.id); r.name = t.value.trim() || r.name; persist('routes'); }
  else if(onchange==='start-route-preview'){ updateRoutePreview(t.value); }
  else if(onchange==='fuel-date-from'){ UI.fuelDateFrom = t.value; render(); }
  else if(onchange==='fuel-date-to'){ UI.fuelDateTo = t.value; render(); }
  else if(onchange==='fuel-kind-filter'){ UI.fuelKindFilter = t.value; render(); }
  else if(onchange==='order-contractor-filter'){ UI.orderContractorFilter = t.value; render(); }
  else if(onchange==='order-product-query'){ UI.orderProductQuery = t.value; render(); }
  else if(onchange==='pricegroup-product-query'){ UI.pricegroupProductQuery = t.value; render(); }
  else if(onchange==='matrix-range-toggle'){
    const input = document.getElementById('matrixEndDateInput');
    if(input){ input.style.display = t.checked ? '' : 'none'; if(!t.checked) input.value=''; }
  }
  else if(onchange==='matrix-date-pick'){
    UI.matrixDate = t.value || todayStr();
    UI.pricegroupProductQuery = '';
    render();
  }
  else if(onchange==='order-status-change'){
    const o = DB.orders.find(x=>x.id===t.dataset.id);
    if(o){ o.status = t.value; persist('orders'); }
  }
});

let routeDragCid = null;

root.addEventListener('dragstart', function(e){
  const item = e.target.closest('.route-drag-item');
  if(!item){ e.preventDefault(); return; }
  routeDragCid = item.dataset.cid;
  item.classList.add('dragging');
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', routeDragCid); }catch(err){}
  }
});

root.addEventListener('dragend', function(e){
  const item = e.target.closest('.route-drag-item');
  if(item) item.classList.remove('dragging');
  document.querySelectorAll('.route-drag-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
  routeDragCid = null;
});

root.addEventListener('dragover', function(e){
  if(!routeDragCid) return;
  const item = e.target.closest('.route-drag-item');
  if(!item) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
});

root.addEventListener('dragenter', function(e){
  if(!routeDragCid) return;
  const item = e.target.closest('.route-drag-item');
  if(!item || item.dataset.cid===routeDragCid) return;
  item.classList.add('drag-over');
});

root.addEventListener('dragleave', function(e){
  const item = e.target.closest('.route-drag-item');
  if(item && (!e.relatedTarget || !item.contains(e.relatedTarget))) item.classList.remove('drag-over');
});

root.addEventListener('drop', function(e){
  const item = e.target.closest('.route-drag-item');
  if(!item || !routeDragCid) return;
  e.preventDefault();
  item.classList.remove('drag-over');
  const targetCid = item.dataset.cid;
  if(targetCid===routeDragCid) return;
  const route = DB.routes.find(r=>r.id===UI.openRouteId);
  if(!route) return;
  const ids = [...route.contractorIds];
  const fromIdx = ids.indexOf(routeDragCid);
  const toIdx = ids.indexOf(targetCid);
  if(fromIdx===-1 || toIdx===-1) return;
  ids.splice(fromIdx,1);
  ids.splice(toIdx,0,routeDragCid);
  route.contractorIds = ids;
  persist('routes');
  render();
});

root.addEventListener('keydown', function(e){
  const t = e.target;
  if(!t.classList) return;

  if(t.classList.contains('summary-cell-input')){
    if(e.key==='Enter'){ e.preventDefault(); commitSummaryCellEdit(t); return; }
    if(e.key==='Escape'){ e.preventDefault(); UI.summaryEditCell=null; render(); return; }
    return;
  }

  if(t.classList.contains('matrix-price-input')){
    if(!['Enter','ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    const form = t.closest('form');
    if(!form) return;
    const row = Number(t.dataset.row);
    const col = Number(t.dataset.col);
    let sel = null;
    if(e.key==='Enter' || e.key==='ArrowDown') sel = `.matrix-price-input[data-row="${row+1}"][data-col="${col}"]`;
    else if(e.key==='ArrowUp') sel = `.matrix-price-input[data-row="${row-1}"][data-col="${col}"]`;
    else if(e.key==='ArrowLeft') sel = `.matrix-price-input[data-row="${row}"][data-col="${col-1}"]`;
    else if(e.key==='ArrowRight') sel = `.matrix-price-input[data-row="${row}"][data-col="${col+1}"]`;
    const target = sel && form.querySelector(sel);
    if(target){ target.focus(); target.select(); }
    return;
  }

  const selector = t.classList.contains('order-qty-input') ? '.order-qty-input'
                  : t.classList.contains('price-input') ? '.price-input'
                  : null;
  if(!selector) return;
  if(e.key!=='Enter' && e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
  e.preventDefault();
  const form = t.closest('form');
  if(!form) return;
  const inputs = Array.from(form.querySelectorAll(selector));
  const idx = inputs.indexOf(t);
  if(idx===-1) return;
  const nextIdx = e.key==='ArrowUp' ? idx-1 : idx+1;
  const target = inputs[nextIdx];
  if(target){ target.focus(); target.select(); }
});

root.addEventListener('focusout', function(e){
  const t = e.target;
  if(t.classList && t.classList.contains('summary-cell-input')){
    commitSummaryCellEdit(t);
  }
});

root.addEventListener('submit', async function(e){
  const form = e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const fd = new FormData(form);

  if(type==='login'){
    const username = (fd.get('username')||'').trim();
    const password = fd.get('password')||'';
    if(!username || !password) return;
    const email = username.toLowerCase()+'@'+AUTH_FAKE_DOMAIN;
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error || !data || !data.user){
        UI.loginError = 'Nieprawidłowa nazwa użytkownika lub hasło.';
        render(); return;
      }
      const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      if(profErr || !profile){
        await sb.auth.signOut();
        UI.loginError = 'Zalogowano, ale nie znaleziono profilu tego konta. Skontaktuj się z administratorem.';
        render(); return;
      }
      if(profile.active===false){
        await sb.auth.signOut();
        UI.loginError = 'To konto zostało wyłączone.';
        render(); return;
      }
      UI.currentUser = profile;
      UI.loginError = '';
      render();
    }catch(err){
      UI.loginError = 'Nie udało się połączyć z serwerem logowania. Sprawdź połączenie z internetem i spróbuj ponownie.';
      render();
    }
    return;
  }

  if(type==='contractor'){
    const id = form.dataset.id;
    const obj = {name:fd.get('name').trim(), city:fd.get('city').trim(), address:fd.get('address').trim(), contact:fd.get('contact').trim(), phone:fd.get('phone').trim(), nip:(fd.get('nip')||'').replace(/[^0-9]/g,''), priceGroupId:fd.get('priceGroupId')||'', notes:fd.get('notes').trim()};
    if(!obj.name) return;
    const checkedRouteIds = fd.getAll('routeIds');
    let contractorId = id;
    if(id){
      DB.contractors = DB.contractors.map(c=>c.id===id?{...c,...obj}:c);
      persist('contractors');
    } else {
      const newContractor = {...obj, id:uid('ctr')};
      contractorId = newContractor.id;
      DB.contractors = [...DB.contractors, newContractor];
      persist('contractors');
    }
    DB.routes = DB.routes.map(r=>{
      const shouldHave = checkedRouteIds.includes(r.id);
      const has = r.contractorIds.includes(contractorId);
      if(shouldHave && !has) return {...r, contractorIds:[...r.contractorIds, contractorId]};
      if(!shouldHave && has) return {...r, contractorIds:r.contractorIds.filter(cid=>cid!==contractorId)};
      return r;
    });
    persist('routes');
    UI.modal=null; render();
  }

  else if(type==='price-group'){
    const id = form.dataset.id;
    const obj = {name:fd.get('name').trim(), price: fd.get('price')?Number(fd.get('price')):'', notes:(fd.get('notes')||'').trim()};
    if(!obj.name) return;
    if(id){ DB.priceGroups = DB.priceGroups.map(g=>g.id===id?{...g,...obj}:g); }
    else { DB.priceGroups = [...DB.priceGroups, {...obj, id:uid('pg'), productPrices:{}}]; }
    persist('priceGroups'); UI.modal=null; render();
  }

  else if(type==='user'){
    const id = form.dataset.id;
    const name = (fd.get('name')||'').trim();
    const username = (fd.get('username')||'').trim();
    const password = fd.get('password')||'';
    if(!name || !username) return;
    const dup = usersCache.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==id);
    if(dup){ alert('Ta nazwa użytkownika jest już zajęta. Wybierz inną.'); return; }
    const active = fd.get('active')==='on';
    const permissions = {};
    PERMISSION_MODULES.forEach(pm=>{ permissions[pm.key] = fd.get(`perm_${pm.key}`)==='on'; });

    try{
      if(id){
        await callAdminUsersFn('update', { id, name, username, password: password||undefined, active, permissions });
        if(currentUser() && currentUser().id===id){
          UI.currentUser = {...currentUser(), name, username, active, permissions};
        }
      } else {
        if(!password){ alert('Podaj hasło dla nowego użytkownika.'); return; }
        const wasBootstrap = bootstrapMode;
        await callAdminUsersFn('create', { name, username, password, permissions });
        if(wasBootstrap){
          // pierwsze konto w systemie — logujemy je od razu, żeby nie trzeba było wypełniać formularza drugi raz
          const email = username.toLowerCase()+'@'+AUTH_FAKE_DOMAIN;
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if(!error && data && data.user){
            const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
            if(profile) UI.currentUser = profile;
          }
          bootstrapMode = false;
        }
      }
      await loadUsers();
      UI.modal=null; render();
    }catch(err){
      alert('Nie udało się zapisać użytkownika: ' + err.message);
    }
  }

  else if(type==='pricegroup-prices'){
    const id = form.dataset.id;
    const g = DB.priceGroups.find(x=>x.id===id);
    if(!g) return;
    const productPrices = {...(g.productPrices||{})};
    DB.products.forEach(p=>{
      const raw = fd.get(`price_${p.id}`);
      if(raw===null) return; // pole spoza aktualnego filtra wyszukiwania — nie dotykaj
      if(raw===''){ delete productPrices[p.id]; }
      else { productPrices[p.id] = Number(raw); }
    });
    g.productPrices = productPrices;
    persist('priceGroups'); render();
  }

  else if(type==='pricegroup-matrix'){
    const startDate = form.dataset.date;
    if(!startDate) return;
    const endDate = fd.get('endDate') || null;

    DB.priceGroups.forEach(g=>{
      g.priceLists = g.priceLists || [];
      let pl = g.priceLists.find(x=> x.startDate===startDate);
      if(!pl){ pl = {id:uid('pl'), startDate, endDate, prices:{}, notes:''}; g.priceLists.push(pl); }
      else { pl.endDate = endDate; }
      const prices = {...(pl.prices||{})};
      DB.products.forEach(p=>{
        const fieldName = `price_${g.id}_${p.id}`;
        if(!fd.has(fieldName)) return; // produkt spoza aktualnego filtra wyszukiwania — nie dotykaj
        const raw = fd.get(fieldName);
        if(raw===''){ delete prices[p.id]; }
        else { prices[p.id] = Number(raw); }
      });
      pl.prices = prices;
    });
    persist('priceGroups'); render();
  }

  else if(type==='route-new'){
    const name = fd.get('name').trim();
    if(!name) return;
    const nr = {id:uid('route'), name, description:fd.get('description').trim(), contractorIds:[]};
    DB.routes = [...DB.routes, nr]; persist('routes');
    UI.modal=null; UI.openRouteId=nr.id; render();
  }

  else if(type==='employee'){
    const id = form.dataset.id;
    const position = fd.get('position');
    const status = fd.get('status') || 'Aktywny';
    const obj = {
      name:fd.get('name').trim(), phone:fd.get('phone').trim(), position,
      contractType:fd.get('contractType')||'', pesel:(fd.get('pesel')||'').trim(), address:(fd.get('address')||'').trim(),
      status, employmentStartDate:fd.get('employmentStartDate')||'', employmentEndDate: status==='Nie pracuje' ? (fd.get('employmentEndDate')||'') : '',
      medicalValidUntil:fd.get('medicalValidUntil')||'', licenseValidUntil:fd.get('licenseValidUntil')||'', idValidUntil:fd.get('idValidUntil')||'',
      leaveEntitlement: Number(fd.get('leaveEntitlement'))||26,
      notes:(fd.get('notes')||'').trim(),
    };
    if(!obj.name) return;
    if(id){
      DB.employees = DB.employees.map(e=>{
        if(e.id!==id) return e;
        const next = {...e, ...obj};
        if(position===POSITION_DRIVER && !next.token) next.token = genToken();
        return next;
      });
    } else {
      const newEmp = {...obj, id:uid('emp'), contractFiles:[], medicalFiles:[], licenseFiles:[], idFiles:[], otherFiles:[], leaves:[], payroll:[]};
      if(position===POSITION_DRIVER) newEmp.token = genToken();
      DB.employees = [...DB.employees, newEmp];
    }
    persist('employees'); UI.modal=null; render();
  }

  else if(type==='leave'){
    const employeeId = form.dataset.employee;
    const emp = DB.employees.find(x=>x.id===employeeId);
    if(!emp) return;
    const entry = {
      id:uid('leave'), type:fd.get('type'), startDate:fd.get('startDate'), endDate:fd.get('endDate'),
      days:Number(fd.get('days'))||0, notes:(fd.get('notes')||'').trim(),
    };
    if(!entry.startDate || !entry.endDate) return;
    emp.leaves = [...(emp.leaves||[]), entry];
    persist('employees'); UI.modal=null; render();
  }

  else if(type==='payroll'){
    const employeeId = form.dataset.employee;
    const emp = DB.employees.find(x=>x.id===employeeId);
    if(!emp) return;
    const entry = {
      id:uid('pay'), month:fd.get('month'), gross:Number(fd.get('gross'))||0, net:Number(fd.get('net'))||0,
      paymentDate:fd.get('paymentDate')||'', notes:(fd.get('notes')||'').trim(),
    };
    if(!entry.month) return;
    emp.payroll = [...(emp.payroll||[]), entry];
    persist('employees'); UI.modal=null; render();
  }

  else if(type==='fuel'){
    const id = form.dataset.id;
    const kind = fd.get('kind') || 'wewnetrzne';
    const isExternal = kind==='zewnetrzne';
    let vehicleId = fd.get('vehicleId') || '';
    let customPlate = '';
    if(isExternal){
      vehicleId = '';
      customPlate = (fd.get('customPlateExternal')||'').trim();
    } else if(vehicleId==='__other__'){
      customPlate = (fd.get('customPlateInny')||'').trim();
      vehicleId = '';
    }
    const tankId = fd.get('tankId');
    const employeeId = fd.get('employeeId') || '';
    const date = fd.get('date') || todayStr();
    const liters = Number(fd.get('liters'))||0;
    const cost = Number(fd.get('cost'))||0;
    const odometer = fd.get('odometer') ? Number(fd.get('odometer')) : null;
    const notes = (fd.get('notes')||'').trim();

    if(!vehicleId && !customPlate){
      alert(isExternal ? 'Podaj numer rejestracyjny pojazdu zewnętrznego.' : 'Wybierz pojazd z listy albo wybierz „Inny” i wpisz numer rejestracyjny.');
      return;
    }
    if(!tankId){
      alert('Wybierz zbiornik.');
      return;
    }
    if(!date || liters<=0){
      alert('Uzupełnij datę oraz ilość litrów (większą od zera).');
      return;
    }
    if(!isExternal && !odometer){
      alert('Podaj przebieg pojazdu (dla tankowania wewnętrznego jest wymagany).');
      return;
    }
    if(isExternal && cost<=0){
      alert('Dla tankowania zewnętrznego (sprzedaży paliwa) podaj kwotę.');
      return;
    }

    const targetTank = DB.tanks.find(t=>t.id===tankId);
    if(!targetTank) return;

    const oldEntry = id ? DB.fuel.find(f=>f.id===id) : null;
    let availableInTargetTank = targetTank.currentLevel;
    if(oldEntry && oldEntry.tankId===tankId) availableInTargetTank += Number(oldEntry.liters||0);

    if(availableInTargetTank < liters){
      alert(`Za mało paliwa w zbiorniku „${targetTank.name}”. Dostępne: ${availableInTargetTank.toFixed(1)} l.`);
      return;
    }

    if(oldEntry && oldEntry.tankId){
      const oldTank = DB.tanks.find(t=>t.id===oldEntry.tankId);
      if(oldTank) oldTank.currentLevel = Math.min(oldTank.capacity, oldTank.currentLevel + Number(oldEntry.liters||0));
    }
    const freshTank = DB.tanks.find(t=>t.id===tankId);
    freshTank.currentLevel = Math.max(0, freshTank.currentLevel - liters);
    persist('tanks');

    const obj = {vehicleId: vehicleId||null, customPlate: vehicleId?'':customPlate, tankId, employeeId, kind, date, liters, cost, odometer, notes};
    if(id){ DB.fuel = DB.fuel.map(f=>f.id===id?{...f,...obj}:f); }
    else { DB.fuel = [...DB.fuel, {...obj, id:uid('fuel')}]; }
    persist('fuel'); UI.modal=null; render();
  }

  else if(type==='tank'){
    const id = form.dataset.id;
    const obj = {name:fd.get('name').trim(), capacity:Number(fd.get('capacity'))||0, currentLevel:Number(fd.get('currentLevel'))||0};
    if(!obj.name || obj.capacity<=0) return;
    obj.currentLevel = Math.min(obj.currentLevel, obj.capacity);
    if(id){ DB.tanks = DB.tanks.map(t=>t.id===id?{...t,...obj}:t); }
    else { DB.tanks = [...DB.tanks, {...obj, id:uid('tank'), deliveries:[]}]; }
    persist('tanks'); UI.modal=null; render();
  }

  else if(type==='tank-delivery'){
    const tankId = form.dataset.tank;
    const tank = DB.tanks.find(t=>t.id===tankId);
    if(!tank) return;
    const liters = Number(fd.get('liters'))||0;
    if(liters<=0) return;
    const entry = {id:uid('del'), date:fd.get('date')||todayStr(), liters, supplier:(fd.get('supplier')||'').trim(), cost:Number(fd.get('cost'))||0, notes:(fd.get('notes')||'').trim()};
    tank.deliveries = [...(tank.deliveries||[]), entry];
    tank.currentLevel = Math.min(tank.capacity, tank.currentLevel + liters);
    persist('tanks'); UI.modal=null; render();
  }

  else if(type==='order-new-admin'){
    const contractorId = fd.get('contractorId');
    const date = fd.get('date') || todayStr();
    if(!contractorId){
      alert('Wybierz kontrahenta z listy podpowiedzi (kliknij w jedną z pozycji, która pojawi się pod polem wyszukiwania).');
      return;
    }
    if(!date) return;
    let order = DB.orders.find(o=>o.contractorId===contractorId && o.date===date);
    if(!order){
      order = {id:uid('ord'), contractorId, date, items:[], notes:'', status:'Nowe', source:'admin', createdAt:new Date().toISOString()};
      DB.orders = [...DB.orders, order];
      persist('orders');
    }
    UI.modal=null; UI.openOrderId=order.id; render();
  }

  else if(type==='order-items'){
    const id = form.dataset.id;
    const order = DB.orders.find(o=>o.id===id);
    if(!order) return;
    const existingItems = order.items || [];
    const items = [];
    DB.products.forEach(p=>{
      if(!fd.has(`qty_${p.id}`)){
        const prev = existingItems.find(it=>it.productId===p.id);
        if(prev) items.push(prev);
        return;
      }
      const raw = fd.get(`qty_${p.id}`);
      const qty = raw ? Number(raw) : 0;
      const unit = fd.get(`unit_${p.id}`) || 'kg';
      if(qty>0){
        const prev = existingItems.find(it=>it.productId===p.id);
        items.push({...(prev||{}), productId:p.id, qty, unit});
      }
    });
    order.items = items;
    order.notes = (fd.get('notes')||'').trim();
    order.updatedAt = new Date().toISOString();
    persist('orders'); render();
  }

  else if(type==='order-date-select'){
    const date = fd.get('date');
    if(!date) return;
    UI.orderFormDate = date;
    UI.orderProductQuery = '';
    UI.orderStep = 'items';
    render();
  }

  else if(type==='order-submit'){
    const contractorId = form.dataset.contractor;
    const date = form.dataset.date;
    if(!contractorId || !date) return;
    let order = DB.orders.find(o=>o.contractorId===contractorId && o.date===date);
    const existingItems = order?.items || [];
    const items = [];
    DB.products.forEach(p=>{
      if(!fd.has(`qty_${p.id}`)){
        const prev = existingItems.find(it=>it.productId===p.id);
        if(prev) items.push(prev);
        return;
      }
      const raw = fd.get(`qty_${p.id}`);
      const qty = raw ? Number(raw) : 0;
      const unit = fd.get(`unit_${p.id}`) || 'kg';
      if(qty>0){
        const prev = existingItems.find(it=>it.productId===p.id);
        items.push({...(prev||{}), productId:p.id, qty, unit});
      }
    });
    const notes = (fd.get('notes')||'').trim();
    if(order){
      order.items = items;
      order.notes = notes;
      order.source = 'client';
      order.updatedAt = new Date().toISOString();
    } else {
      order = {id:uid('ord'), contractorId, date, items, notes, status:'Nowe', source:'client', createdAt:new Date().toISOString()};
      DB.orders = [...DB.orders, order];
    }
    persist('orders');
    UI.orderStep = 'done';
    render();
  }

  else if(type==='product'){
    const id = form.dataset.id;
    const obj = {
      name:fd.get('name').trim(), unit:(fd.get('unit')||'szt.').trim(),
      piece_kg: fd.get('pieceKg') ? Number(fd.get('pieceKg')) : null,
      container_kg: fd.get('containerKg') ? Number(fd.get('containerKg')) : null,
      notes:(fd.get('notes')||'').trim(),
    };
    if(!obj.name) return;
    try{
      if(id){
        const { error } = await sb.from('products').update(obj).eq('id', id);
        if(error) throw error;
      } else {
        const { error } = await sb.from('products').insert(obj);
        if(error) throw error;
      }
      await loadProducts();
      UI.modal=null; render();
    }catch(err){
      alert('Nie udało się zapisać produktu: ' + err.message);
    }
  }

  else if(type==='product-bulk'){
    const raw = fd.get('bulk')||'';
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    const newProducts = lines.map(line=>{
      const parts = line.split(';').map(s=>s.trim());
      return {
        name:parts[0], unit:parts[1]||'szt.',
        piece_kg: parts[2] ? Number(parts[2]) : null,
        container_kg: parts[3] ? Number(parts[3]) : 15,
        notes:'',
      };
    }).filter(p=>p.name);
    if(newProducts.length===0) return;
    try{
      const { error } = await sb.from('products').insert(newProducts);
      if(error) throw error;
      await loadProducts();
      UI.modal=null; render();
    }catch(err){
      alert('Nie udało się dodać produktów: ' + err.message);
    }
  }

  else if(type==='vehicle'){
    const id = form.dataset.id;
    const obj = {plate:fd.get('plate').trim(), brand:fd.get('brand').trim(), model:fd.get('model').trim(), driverId:fd.get('driverId')||'', notes:fd.get('notes').trim()};
    if(!obj.plate) return;
    if(id){ DB.vehicles = DB.vehicles.map(v=>v.id===id?{...v,...obj}:v); }
    else { DB.vehicles = [...DB.vehicles, {...obj, id:uid('veh'), insurances:[], inspections:[], repairs:[]}]; }
    persist('vehicles'); UI.modal=null; render();
  }

  else if(type==='insurance'){
    const vehicleId = form.dataset.vehicle;
    const v = DB.vehicles.find(x=>x.id===vehicleId);
    if(!v) return;
    const entry = {
      id:uid('ins'), startDate:fd.get('startDate'), endDate:fd.get('endDate'),
      company:fd.get('company').trim(), cost:Number(fd.get('cost'))||0, notes:fd.get('notes').trim(),
    };
    if(!entry.endDate) return;
    v.insurances = [...v.insurances, entry];
    persist('vehicles'); UI.modal=null; render();
  }

  else if(type==='inspection'){
    const vehicleId = form.dataset.vehicle;
    const v = DB.vehicles.find(x=>x.id===vehicleId);
    if(!v) return;
    const entry = {
      id:uid('insp'), date:fd.get('date'), validUntil:fd.get('validUntil'),
      cost:Number(fd.get('cost'))||0, notes:fd.get('notes').trim(),
    };
    if(!entry.validUntil) return;
    v.inspections = [...v.inspections, entry];
    persist('vehicles'); UI.modal=null; render();
  }

  else if(type==='repair'){
    const vehicleId = form.dataset.vehicle;
    const v = DB.vehicles.find(x=>x.id===vehicleId);
    if(!v) return;
    const entry = {
      id:uid('rep'), date:fd.get('date'), description:fd.get('description').trim(),
      workshop:fd.get('workshop').trim(), cost:Number(fd.get('cost'))||0,
    };
    if(!entry.description) return;
    v.repairs = [...v.repairs, entry];
    persist('vehicles'); UI.modal=null; render();
  }

  else if(type==='start-trip'){
    const routeId = fd.get('routeId');
    const initialCount = Number(fd.get('initialCount'))||0;
    if(!routeId) return;
    const nt = {
      id:uid('trip'), driverId:UI.driverId, routeId, date:todayStr(), startedAt:new Date().toISOString(),
      initialCount, initialApproved:false, initialApprovedBy:null, initialApprovedAt:null,
      entries:[], finished:false, finalCount:null, finalApproved:false, finalApprovedBy:null, finishedAt:null
    };
    DB.trips = [...DB.trips, nt]; persist('trips'); render();
  }

  else if(type==='visit'){
    const cid = form.dataset.cid;
    const left = Number(fd.get('left'))||0;
    const taken = Number(fd.get('taken'))||0;
    const today = todayStr();
    const trip = DB.trips.find(t=>t.driverId===UI.driverId && t.date===today);
    const exists = trip.entries.some(en=>en.contractorId===cid);
    trip.entries = exists
      ? trip.entries.map(en=> en.contractorId===cid ? {...en,left,taken} : en)
      : [...trip.entries, {id:uid('entry'), contractorId:cid, left, taken, time:new Date().toISOString().slice(11,16)}];
    persist('trips'); UI.driverVisitContractorId=null; render();
  }

  else if(type==='finish-trip'){
    const finalCount = Number(fd.get('finalCount'))||0;
    const today = todayStr();
    const trip = DB.trips.find(t=>t.driverId===UI.driverId && t.date===today);
    trip.finished=true; trip.finalCount=finalCount; trip.finishedAt=new Date().toISOString();
    persist('trips'); UI.driverFinishing=false; render();
  }
});

/* ======================================================================
   OBSŁUGA PLIKÓW (zdjęcia / PDF) — odczyt + kompresja zdjęć po stronie przeglądarki
   ====================================================================== */
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return fileToDataUrl(file).then(dataUrl=>{
    if(!file.type || !file.type.startsWith('image/')) return dataUrl;
    return new Promise(resolve=>{
      const img = new Image();
      img.onload = () => {
        let {width, height} = img;
        if(width>maxDim || height>maxDim){
          const scale = maxDim/Math.max(width,height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        try{
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  });
}

async function processFileList(fileList){
  const files = Array.from(fileList);
  const results = [];
  for(const f of files){
    try{
      const dataUrl = await compressImage(f);
      const isImage = f.type && f.type.startsWith('image/');
      results.push({id:uid('file'), name:f.name, type: isImage ? 'image/jpeg' : (f.type||'application/octet-stream'), dataUrl});
    }catch(e){ console.error('Błąd wczytywania pliku', f.name, e); }
  }
  return results;
}

function applyFuelKindUI(value){
  const isExternal = value==='zewnetrzne';
  const costInput = document.getElementById('fuelCostInput');
  const costLabel = document.getElementById('fuelCostLabel');
  const odometerInput = document.getElementById('fuelOdometerInput');
  const odometerLabel = document.querySelector('#fuelOdometerWrap .lab');
  if(costInput) costInput.required = isExternal;
  if(costLabel) costLabel.textContent = isExternal ? 'Kwota (zł) — wymagana' : 'Kwota (zł) — opcjonalna';
  if(odometerInput) odometerInput.required = !isExternal;
  if(odometerLabel) odometerLabel.textContent = isExternal ? 'Przebieg (km) — opcjonalnie' : 'Przebieg (km)';
}

/* ======================================================================
   POBIERANIE DANYCH KONTRAHENTA PO NIP (rejestr MF — Biała lista VAT)
   ====================================================================== */
function isValidNip(nip){
  if(!/^\d{10}$/.test(nip)) return false;
  const weights = [6,5,7,2,3,4,5,6,7];
  const sum = weights.reduce((s,w,i)=> s + w*Number(nip[i]), 0);
  return (sum % 11) === Number(nip[9]);
}

function mfManualSearchLink(){
  return `<a href="https://www.podatki.gov.pl/wykaz-podatnikow-vat-wyszukiwarka/" target="_blank" rel="noopener" style="color:var(--sky-700);text-decoration:underline;">Sprawdź ręcznie w wyszukiwarce Białej listy VAT ↗</a>`;
}

async function fetchContractorFromMF(){
  const nipInput = document.getElementById('contractorNipInput');
  const statusEl = document.getElementById('contractorMfStatus');
  if(!nipInput || !statusEl) return;
  const nip = (nipInput.value||'').replace(/[^0-9]/g,'');

  if(nip.length!==10){
    statusEl.innerHTML = `<span style="color:var(--red-600);">Podaj poprawny, 10-cyfrowy numer NIP (same cyfry, bez kresek).</span>`;
    return;
  }
  if(!isValidNip(nip)){
    statusEl.innerHTML = `<span style="color:var(--amber-700);">Ta liczba nie wygląda na prawidłowy NIP (suma kontrolna się nie zgadza). Spróbuj mimo to?</span> <button type="button" class="btn-ghost" style="padding:2px 8px;" data-action="contractor:fetch-mf-force">Pobierz mimo to</button>`;
    return;
  }
  await performMfLookup(nip);
}

async function performMfLookup(nip){
  const statusEl = document.getElementById('contractorMfStatus');
  if(!statusEl) return;
  statusEl.innerHTML = `<span style="color:var(--slate-400);">Pobieranie danych z rejestru Ministerstwa Finansów…</span>`;
  try{
    const date = todayStr();
    const res = await fetch(`https://wl-api.mf.gov.pl/api/search/nip/${nip}?date=${date}`, { headers:{'Accept':'application/json'} });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const subject = data && data.result && data.result.subject;
    if(!subject){
      statusEl.innerHTML = `<span style="color:var(--amber-700);">Nie znaleziono podmiotu o tym NIP w rejestrze. </span>${mfManualSearchLink()}`;
      return;
    }
    const fullAddress = subject.workingAddress || subject.residenceAddress || '';
    let city = '', street = fullAddress;
    const m = fullAddress.match(/(\d{2}-\d{3})\s*,?\s*(.+)$/);
    if(m){
      city = m[2].trim();
      street = fullAddress.slice(0, fullAddress.indexOf(m[0])).trim().replace(/,\s*$/,'');
    }
    const nameEl = document.getElementById('contractorNameInput');
    const cityEl = document.getElementById('contractorCityInput');
    const addrEl = document.getElementById('contractorAddressInput');
    if(nameEl && subject.name) nameEl.value = subject.name;
    if(cityEl && city) cityEl.value = city;
    if(addrEl && street) addrEl.value = street;
    statusEl.innerHTML = `<span style="color:var(--emerald-700);">${icon('check',12)} Uzupełniono dane z rejestru MF. Sprawdź i w razie potrzeby popraw.</span>`;
  }catch(err){
    statusEl.innerHTML = `<span style="color:var(--red-600);">Nie udało się pobrać danych automatycznie — najczęściej dzieje się tak, gdy plik jest otwarty lokalnie na dysku (przeglądarka blokuje wtedy takie połączenia) albo brak jest internetu. </span>${mfManualSearchLink()}`;
  }
}

function copyToClipboard(text){
  try{
    navigator.clipboard.writeText(text);
  }catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }catch(e2){}
  }
}
